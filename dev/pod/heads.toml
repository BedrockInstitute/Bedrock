# The five POD heads, the limits and the two concurrency tiers.
#
# WHY THIS FILE EXISTS. Before it, a model name, an effort level and a deadline
# lived in three places: a skill document, a policy module and one literal in
# the dispatcher. The measured failure is at
# `dev/memos/LJ-4-pod-program-design.md:1826-1836`: after row 21 retires
# `scripts/dispatch/dispatch_policy.py`, the dispatcher falls back to a hard
# literal and starts a CODEX agent on a deepseek model for every dispatch that
# omits `--harness`. This file is the ONE home of a model name, an effort level,
# a deadline and a load threshold. AD26 and section 6.1 rule it.
#
# WHO MAY CHANGE IT. The owner, at any time. NOBODY ELSE changes it without a
# named owner approval. R16 puts the file in the spec surface gate's guarded set
# (section 7.3), because it is not a table row and `replay()` never sees it.
#
# HOW THE LOADER READS IT. NO FIELD HAS A SILENT DEFAULT. A missing field is a
# refusal. A misspelt field is a refusal. The loader refuses a model outside
# `legal.models`, an effort outside `legal.efforts` and a missing slot. It
# returns a frozen dict.
#
# WHERE THE LOADER IS. `scripts/pod/heads.py`, section 6.1's ~40-line loader. It
# is the ONE OWNER of this file. `scripts/pod/launcher.py` and
# `scripts/pod/table.py` are READERS: two readers of one file are admissible and
# two owners are not. A reader that cannot reach the loader says so on every
# launch path and never guesses a number from this file.
#
# AD26, NO RETRO-FIT. The program resolves a head ONCE, at dispatch. It writes
# `model`, `effort`, `role` and `heads_sha256` into the transition log line
# (section 5.3.1). Nothing re-reads this file for a running task. A change binds
# a new task only, and a re-dispatch is a fresh instance.

version = 1

[legal]
# THE EMPTY STRING IS LEGAL AND IT MEANS "THIS HARNESS HAS NO EFFORT DIAL".
# `--effort` is a claude CLI flag. A `herdr-pi` head has no equivalent, so a pi row
# carries "" and the launcher omits the flag. Admitted 2026-08-18 when the owner
# ruled the two coder slots onto pi vendors; before that every head was Claude and
# the loader had never seen a row without one.
efforts = ["", "low", "medium", "high", "xhigh", "max"]

# MEASURED 2026-08-17, [LJ-4-0]. Every string below resolves. Two read-backs ran
# per string: `claude -p --output-format json` reports `modelUsage.<key>` and
# `canonicalModel`; a live herdr pane prints a display name in its banner.
# Evidence: `agents/tasks/LJ-4-0/l9.0-b4-model-ids.md:56-70`.
# The three aliases resolve to the three full IDs:
#   opus -> claude-opus-5, fable -> claude-fable-5, sonnet -> claude-sonnet-5
# PREFER A FULL ID IN A `[heads]` ROW. An alias means "the latest model", so it
# moves, and AD26 records the model that ran.
# `claude-haiku-5` does NOT resolve and the client refuses it:
# `[claude-code:unrecognized_model]`, `is_error: true`, zero tokens.
#
# A DATE SUFFIX IS THE CASE THE WHITELIST EXISTS FOR, and it is worse than a
# misspelling because it looks right. MEASURED 2026-08-17:
# `claude-opus-5-20260101` PASSES the client and fails at the API with
# `api_error_status: 404`, "There's an issue with the selected model". Evidence:
# `agents/tasks/LJ-4-0/l9.0-b4-model-ids.md:104-107`. The list below is the first
# guard, because the loader refuses a string it does not hold; the read-back
# below is the second, for a string that IS held and still fails in the pane.
models = ["claude-opus-5", "claude-fable-5", "claude-sonnet-5",
          "opus", "fable", "sonnet",
          # THE TWO NON-CLAUDE HEADS, ruled by the owner 2026-08-18. Both run on the
          # `pi` CLI through `harness = "herdr-pi"`, and each needs its provider named
          # because the provider is NOT the model's family name. Carried from the
          # archived `dev/vendors.toml`, which measured both:
          #   glm-5.3         provider `zai`, and `pi auth check --provider glm`
          #                   returns `provider_not_found` (MEASURED 2026-08-15)
          #   deepseek-v4-pro provider `deepseek`, and the API rejects a date suffix
          # **NEITHER IS READ-BACK VERIFIED THE WAY THE THREE CLAUDE IDS ARE.** Gap B4
          # ran `claude -p` twice per Claude string; no equivalent ran for these two, so
          # the first dispatch on either is also its verification.
          "glm-5.3", "deepseek-v4-pro"]

# THE PROVIDER PER NON-CLAUDE MODEL. `herdr-pi` passes it as `--provider`.
[legal.pi_provider]
"glm-5.3" = "zai"
"deepseek-v4-pro" = "deepseek"

# CARRIED FROM `dev/vendors.toml` BY ROW 21b OF THE GATE TABLE, before that file was
# archived. Both sentences are measurements and neither is repeated anywhere else. Read
# them before you add a `pi`-backed vendor to a `[heads]` row.
#
# 1. `pi auth check` VALIDATES THE PROVIDER AND NOT THE MODEL. MEASURED 2026-08-16, side
#    by side: it answered `ready` for a real model path AND for a bogus short ID. So a
#    launcher refusal built on `auth check` cannot fire on a wrong model ID for this
#    vendor. `[LJ-1.387]` then ran on the bogus ID, `pi` warned
#    `Model "..." not found for provider "mlxvlm". Using custom model id.`, echoed its
#    prompt, and exited `done` in 10 seconds having written nothing.
# 2. THE ONE CHECK THAT DISCRIMINATES IS THE MODEL COLUMN OF `pi --list-models`. Read a
#    `pi` model ID from there, never from `auth check`. For this vendor the ID is the
#    ABSOLUTE STORAGE PATH and never the short name.
#
# Evidence: `archive/dev/vendors.toml:144-152`. The same failure class is why the
# read-back rule below exists for the Claude heads: a provider that answers is not a
# model that exists.

# THE READ-BACK REFUSAL, and the measurement inverted the design's rule.
#
# A wrong model ID passes the loader when `legal.models` holds it. It then fails
# INSIDE the pane. `herdr agent start` still returns `agent_started` with
# `interactive_ready: true`, the agent reaches `working` and then `done`, and
# every guard in the launcher reads that as a healthy run.
# Evidence: `agents/tasks/LJ-4-0/l9.0-b4-model-ids.md:95-101`.
#
# So the POD's `launch()` wrapper runs `herdr agent read` after `agent start`
# and applies THIS rule:
#
#   Read the banner line that ends with `· Claude Max`.
#   PARK the task when that line contains the requested model string verbatim.
#   Match case sensitively, because `Opus 5` contains `opus` under a
#   case-insensitive match.
#
# A resolving ID prints a DISPLAY NAME and never prints its own ID:
#   `Opus 5 with max effort · Claude Max`
# A failing ID prints its own ID verbatim:
#   `claude-haiku-5 with max effort · Claude Max`
#
# Rule (f) parks the task with `reason: "launch"`.
#
# WHERE THE RULE IS EXECUTED. `model_readback_ok()` in `scripts/pod/pod.py`, which
# rule (f) calls after the launcher returns 0. A banner it cannot read is NOT a
# refusal, because the rule fires only on a POSITIVE detection.
#
# THE DESIGN'S OWN TEXT IS REFUTED. Section 6.1 at
# `dev/memos/LJ-4-pod-program-design.md:1754-1755` reads "A pane that does not
# name the model it asked for returns NO PID". That rule parks every correct
# dispatch and passes every wrong one. Evidence:
# `agents/tasks/LJ-4-0/l9.0-b4-model-ids.md:103-113`.

[limits]
tick_seconds = 30             # the runner's sleep, section 5.0
exclusive_max_load1 = 6.0     # refuse to start an exclusive task above this
agda_deadline_s = 1800        # the POD owns the deadline. See gap M2
worker_deadline_s = 14400     # a worker that runs longer is killed, section 5.1
attempt_max = 4               # consecutive retries on ONE row, then PARK. B2
parked_max = 7                # this many PARKED tasks stop the loop, rule (d)

# THE 1800 s AGDA DEADLINE CLEARS THE MEASURED WORST CASE BY 5.9 TIMES.
# MEASURED 2026-08-17, [LJ-4-0] gap B3: the widest acceptance class, `d5-base`
# over `src/Base/Prelude.lagda.md`, ran 300.81 s, and a cold whole-tree run ran
# 305.70 s. Evidence: `agents/tasks/LJ-4-0/l9.0-b3-probe-report.md:133`.

# THE TWO CONCURRENCY TIERS, restored by amendment A14 from `dev/LESSONS.md`
# C-12. A task declares its tier in its table row. The design pinned
# `AGDA_SLOTS = 2` and dropped the WIDE tier, which halved throughput.
#
# The design names the two tiers and their numbers at
# `dev/memos/LJ-4-pod-program-design.md:1701-1704` and `:102-112`. It names NO KEY
# for them. The key names below are this file's, and a reader of `admits()`
# needs them to match.
[tiers.wide]
slots = 4                     # up to FOUR concurrent Agda writers
heap = "-A64m -I0 -M8g"       # R13's caliber, one caliber PER TIER

[tiers.heavy]
slots = 2                     # at most TWO concurrent Agda writers
heap = "-A64m -I0 -M12g"      # the heavy caliber

[tiers.shared]
max_heap_sum_gb = 32          # `admits()` holds the mixed worst case at or under this
free_memory_pct_for_extra = 25  # fill slots three and four only above this
per_process_backstop_gb = 14  # C-12's backstop, restored by A13
system_free_floor_pct = 8     # C-12's floor, restored by A13

# A RECORD CARRIES ITS TIER. Compare two measurements only inside one tier.
# `scripts/pod/launcher.py:launch()` writes `tier` and `agda_heap` into the
# registry record, and its `agda_heap_sum_over()` takes the MIXED sum across
# every live holder. A slot count cannot see that sum: two HEAVY holders and two
# WIDE sit inside both per-tier ceilings and still budget 40 GB.
#
# WHAT THIS BLOCK DOES NOT HOLD. A15 also names a WHOLE-TREE `make check`
# caliber, `-A64m -I0 -M16g`, because that run holds the machine alone. It is not
# a tier: it has no slot count and no concurrency. It lives as a literal at
# `scripts/pod/facts.py:80` today.

# THE FIVE HEADS. AD24 and AD25 name four. AD2 needs a fifth, the maintainer,
# and amendment A12 rules it `claude-opus-5` at effort `high` on 2026-08-17,
# which closes gap M8.
#
# `harness` is the launcher's `--harness` value. `herdr-claude` runs a CLAUDE
# agent in a server-owned pane, and edit 1 of section 6.2 adds it to the
# launcher's `HERDR_KIND` map.
# `sandbox` is the codex `-s` value, and for a CLAUDE head it is neither read nor
# sent. MEASURED 2026-08-19: `launch()` hardcodes `--permission-mode` for the
# `claude` kind at `scripts/pod/launcher.py:1353`, and the only other reader is
# `validate()`, which tests for `read-only` alone. This comment used to say the
# column WAS the `--permission-mode` value, which was true when it was written
# and stopped being true when the flag was hardcoded.
# **THE CLAUDE PERMISSION MODE IS `auto`, owner's ruling 2026-08-19**, and its one
# home is that launcher line.
[heads]
# RULED BY THE OWNER, 2026-08-18. The mathematician side runs Claude at three efforts;
# the coder side runs the two `pi` vendors. **The DD17 invariant still holds: the critic
# is never the same model as the author**, on both sides.
mathematician             = { model = "claude-opus-5",   effort = "max",   harness = "herdr-claude", sandbox = "acceptEdits" }
mathematician_adversarial = { model = "glm-5.3",         effort = "",      harness = "herdr-pi",     sandbox = "acceptEdits" }
coder                     = { model = "glm-5.3",         effort = "",      harness = "herdr-pi",     sandbox = "acceptEdits" }
coder_adversarial         = { model = "deepseek-v4-pro", effort = "",      harness = "herdr-pi",     sandbox = "acceptEdits" }
maintainer                = { model = "claude-opus-5",   effort = "high",  harness = "herdr-claude", sandbox = "acceptEdits" }
