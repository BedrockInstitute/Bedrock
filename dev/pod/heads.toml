# A SLOT IS ONE INLINE TABLE OR AN ARRAY OF THEM, amendment A27, owner's ruling
# 2026-08-21. The array is a STRICT SUPERSET: an array of one means what a single
# table means, and the two single-head slots below (`mathematician` and
# `maintainer`) are spelled exactly as they were before A27.
# `max_concurrency` is the ONE optional field. It caps the tasks that may hold
# that SLOT on that MODEL at one time, and an omitted one means unlimited, which
# is what every row here meant until A27 and what seven of the eight mean today.
#
# **THE CAP IS NOT THE AGDA CONCURRENCY OF `[tiers]` ABOVE AND THE TWO NEVER
# MEET.** `[tiers]` is A14's: it counts Agda WRITER processes and their heap, it
# is system wide, and `admits()` refuses on it BEFORE any head is chosen.
# `max_concurrency` counts TASKS holding one head, it is per slot and per model,
# and `pick_head_config()` reads it AFTER `admits()` has already said yes. A task
# passes both or it does not dispatch.
#
# **THE SELECTION POLICY IS CAPPED FIRST, and it lives in ONE named function**,
# `pick_head_config()` in `scripts/pod/pod.py`. A capped head is capped because
# it is a scarce local resource, so the program spends it up to its limit before
# it spills demand onto a head with no limit. A tie between two capped heads with
# headroom goes to the one written FIRST in the array, so the order below is the
# owner's ranking. **THE CONSEQUENCE, stated because it is easy to miss: while
# the pod runs ONE coder task at a time, every one of them goes to the local
# model and the second head gets nothing.** The uncapped head is the OVERFLOW
# head under this policy.
#
# **A SECOND HEAD IS ALSO THE RETRY TARGET, amendment A29, and that is a
# DIFFERENT mechanism from the one above.** `pick_head_config()` chooses at
# dispatch and reads the caps. A29 fires AFTER a dispatch returned nothing to
# measure (R7): the failed model goes onto `t.avoid_models`, the task parks
# `fallback:<model>` and re-opens at once on a head it has not spent. THE TRIGGER
# IS THIS FILE'S ARITHMETIC AND NOT A CAP: a slot with a choice retries, a slot
# with one head parks `no-change` and waits for a person, exactly as before.
# So the ORDER of an array below is a preference and its LENGTH is a promise.
[heads]
