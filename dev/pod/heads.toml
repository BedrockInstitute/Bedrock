# THE READ-BACK REFUSAL, and the measurement inverted the design's rule.
#
# A wrong model ID passes the loader when `legal.models` holds it. It then fails
# INSIDE the pane. `herdr agent start` still returns `agent_started` with
# `interactive_ready: true`, the agent reaches `working` and then `done`, and
# every guard in the launcher reads that as a healthy run.
# Evidence: `agents/tasks/LJ-4-0/l9.0-b4-model-ids.md:95-101`.
#
# So the POD's `launch()` wrapper runs `herdr agent read` after `agent start`
# and applies THIS rule:
#
#   Read the banner line that ends with `· Claude Max`.
#   PARK the task when that line contains the requested model string verbatim.
#   Match case sensitively, because `Opus 5` contains `opus` under a
#   case-insensitive match.
#
# A resolving ID prints a DISPLAY NAME and never prints its own ID:
#   `Opus 5 with max effort · Claude Max`
# A failing ID prints its own ID verbatim:
#   `claude-haiku-5 with max effort · Claude Max`
#
# Rule (f) parks the task with `reason: "launch"`.
#
# WHERE THE RULE IS EXECUTED. `model_readback_ok()` in `scripts/pod/pod.py`, which
# rule (f) calls after the launcher returns 0. A banner it cannot read is NOT a
# refusal, because the rule fires only on a POSITIVE detection.
#
# THE DESIGN'S OWN TEXT IS REFUTED. Section 6.1 at
# `dev/memos/LJ-4-pod-program-design.md:1754-1755` reads "A pane that does not
# name the model it asked for returns NO PID". That rule parks every correct
# dispatch and passes every wrong one. Evidence:
# `agents/tasks/LJ-4-0/l9.0-b4-model-ids.md:103-113`.

