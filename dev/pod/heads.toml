# THE TWO CONCURRENCY TIERS, restored by amendment A14 from `dev/LESSONS.md`
# C-12. A task declares its tier in its table row. The design pinned
# `AGDA_SLOTS = 2` and dropped the WIDE tier, which halved throughput.
#
# The design names the two tiers and their numbers at
# `dev/memos/LJ-4-pod-program-design.md:1701-1704` and `:102-112`. It names NO KEY
# for them. The key names below are this file's, and a reader of `admits()`
# needs them to match.
# OWNER'S RULING 2026-08-23 (SECOND, SAME DAY): WIDE and HEAVY split apart again. The
# FIRST ruling this date flattened both to one writer at 4 GB; this one gives WIDE a
# smaller 2 GB cap and two concurrent writers, and leaves HEAVY at one writer, 4 GB.
#
# **`slots = 2` FOR WIDE WAS TRIED, RACED, REVERTED FOR ONE HOUR, THEN PROPERLY FIXED
# AND RESTORED THE SAME DAY, OWNER'S ORDER.** MEASURED: the first attempt stopped the
# loop at `parked_max` within minutes, every park `reason: "launch"`. `admits()`
# (`scripts/pod/pod.py`) gated on `agda_pileup()` alone, a `ps`-based census of AGDA
# PROCESSES ACTUALLY RUNNING this instant; `launcher.py`'s own dispatch check gates on
# `agda_holders()`, the DISPATCH REGISTRY's count of agents CURRENTLY ASSIGNED an Agda
# slot, whether or not that agent happens to be inside an `agda` invocation right now.
# An agent spends most of its session reading and writing, not running `agda`, so
# `agda_pileup()` reads far LOWER than `agda_holders()` almost always -- confirmed
# live: two dispatched WIDE agents, `agda_pileup()` read `(0, {}, None)` while the
# registry held both. At `slots = 1` the two gates agreed by construction (either sees
# "the one slot is taken" the moment ANY task is dispatched); at `slots = 2` they could
# disagree, `admits()` would wave a THIRD dispatch through, and `launcher.py` would
# immediately refuse it, which `_rule_f()` read as a KEPT refusal and parked. THE FIX:
# `admits()` now also asks `agda_registry_slots()` (`scripts/pod/pod.py`), which reads
# the SAME registry census `launcher.py` itself uses, so the two gates cannot disagree
# any more -- `admits()`'s own docstring and `agda_registry_slots()`'s have the rest.
# A SECOND RACE, narrower, survived that fix and was found and closed the same day by
# an opus-5 review: each side filtered the registry's holders by tier differently, so
# a live holder of ONE tier could wrongly bind the OTHER tier's admission decision.
# `agda_holders_in_tier()` (`scripts/pod/launcher.py`) is now the ONE implementation
# both sides call.
[tiers.wide]
slots = 2                     # OWNER'S RULING 2026-08-23 (second, restored after the
                               # admits()/launcher() race above was fixed): two writers
heap = "-A64m -I0 -M2g"       # OWNER'S RULING 2026-08-23 (second): 2 GB cap each

[tiers.heavy]
slots = 1                     # OWNER'S RULING 2026-08-23: one Agda writer, no more
heap = "-A64m -I0 -M4g"       # OWNER'S RULING 2026-08-23: 4 GB cap, unchanged

