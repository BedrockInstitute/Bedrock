# The five POD heads, the limits and the two concurrency tiers.
#
# WHY THIS FILE EXISTS. Before it, a model name, an effort level and a deadline
# lived in three places: a skill document, a policy module and one literal in
# the dispatcher. The measured failure is at
# `dev/memos/LJ-4-pod-program-design.md:1826-1836`: after row 21 retires
# `scripts/dispatch/dispatch_policy.py`, the dispatcher falls back to a hard
# literal and starts a CODEX agent on a deepseek model for every dispatch that
# omits `--harness`. This file is the ONE home of a model name, an effort level,
# a deadline and a load threshold. AD26 and section 6.1 rule it.
#
# WHO MAY CHANGE IT. The owner, at any time. NOBODY ELSE changes it without a
# named owner approval.
#
# **THIS FILE LEFT THE SPEC SURFACE GATE'S GUARDED SET on 2026-08-20**, and this
# comment used to say it was in it. The owner ruled that a role's model may move
# without that gate. MEASURED 2026-08-21: `GUARDED_FILES` at
# `scripts/pod/check-spec-surface.py:211-222` holds `AGENTS.md` and the design
# memo alone, and the entry that named this file is a comment explaining its
# removal. AD26 is unchanged and still forbids the maintainer to re-point a head;
# only conjunct 5 stopped hashing these bytes.
#
# HOW THE LOADER READS IT. NO FIELD HAS A SILENT DEFAULT. A missing field is a
# refusal. A misspelt field is a refusal. The loader refuses a model outside
# `legal.models`, an effort outside `legal.efforts` and a missing slot. It
# returns a frozen dict. **`max_concurrency` IS THE ONE OPTIONAL FIELD** and its
# absence is not a default: it is the word UNLIMITED (amendment A27).
#
# WHERE THE LOADER IS. `scripts/pod/heads.py`, section 6.1's ~40-line loader. It
# is the ONE OWNER of this file. `scripts/pod/launcher.py` and
# `scripts/pod/table.py` are READERS: two readers of one file are admissible and
# two owners are not. A reader that cannot reach the loader says so on every
# launch path and never guesses a number from this file.
#
# AD26, NO RETRO-FIT. The program resolves a head ONCE, at dispatch. It writes
# `model`, `effort`, `role` and `heads_sha256` into the transition log line
# (section 5.3.1). Nothing re-reads this file for a running task. A change binds
# a new task only, and a re-dispatch is a fresh instance.

