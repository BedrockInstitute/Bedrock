# `scripts/pod/launcher.py:launch()` writes `tier` and `agda_heap` into the
# registry record, and its `agda_heap_sum_over()` takes the MIXED sum across
# every live holder. A slot count cannot see that sum: two HEAVY holders and two
# WIDE sit inside both per-tier ceilings and still budget 40 GB.
#
# WHAT THIS BLOCK DOES NOT HOLD. A15 also names a WHOLE-TREE `make check`
# caliber, `-A64m -I0 -M16g`, because that run holds the machine alone. It is not
