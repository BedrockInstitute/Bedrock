# ---------------------------------------------------------------------------
# WHAT IS STILL OWED TO EACH TROPHY, in work rather than in lines.
#
# The two endpoints are `L ⊨ ZFC` (whose open half is AC) and `L ⊨ GCH`. This
# table answers "what is actually left", which the line rows above deliberately
# do not: a row can be large and unblocking, or small and on the critical path,
# and the difference is not visible in a band.
#
# It exists because the technical route keeps moving. Every refutation in this
# campaign has changed what one of the two trophies still needs, and a reader
# who only had the line rows would not have seen that.
#
# Fields. `trophy` is AC, GCH, or BOTH. `status` is one of:
#   delivered   done and standing
#   ready       nothing blocks it; it can be dispatched now
#   in-flight   an agent holds it
#   blocked     something named in `blocked_by` must land first
#   at-risk     delivered, but on machinery that is scheduled to retire
# `evidence` cites the report or file that establishes the claim. An item with
# no evidence is a guess and must say so in its title.
#
# Updated with the ledger, at every return that could move it (D27).
# ---------------------------------------------------------------------------

# ------------------------------------------------------------------
# THE FREEZE (D30, ruled 2026-08-06). Read this before reading `owed`.
#
# No row below marked `frozen` is blocked on mathematics. They are blocked on
# a RULING: no new mathematics is dispatched until the tree's check cost comes
# down. The measurement that produced the ruling is in `[timing]` and `[[hot]]`
# below; the campaign that lifts it is `[L3.32-F]` in dev/PLAN.md section 11.
#
# `frozen` is therefore NOT a synonym for `blocked`. A blocked row needs
# someone to prove something. A frozen row needs the seconds to come down.
# ------------------------------------------------------------------

[[freeze]]
ruled = "2026-08-06"
decision = "D30"
baseline_profile_seconds = 1956
exit_kind = "measurement-complete"
exit_1_profiled = "every master holding >= 2 percent of tree check time has a per-definition profile on record"
exit_2_removed = "for each, the removable fraction is MEASURED in a scratch copy, then removed or refused with a written price here"
exit_3_craft = "P-k standing, and dev/ARCHIVE.md's practice column filled, both BEFORE the D18 archival"
detail = "A first version set a projected 1,100 s and a 0.25 s/line cap. Both are RETIRED. The 1,100 rested on SquareLaw being 95 percent removable, which took the share of time IN Bridge's hot family for the share its fix REMOVED (79 percent); at the honest rate the projection is 1,088 to 1,121, bracketing its own threshold, and [T93] found it unreproducible from these rows. The per-line cap is retired by [L3.32-F0]: the caliber is per obligation, and at that caliber the cross-tree gap is 2.1x while one controlled fix on Bridge was 4.7x, so the cross-tree ratio has less resolving power than the effect and no threshold built on it can gate anything."

# The caliber, settled by [L3.32-F0] and measured by scripts/obligations.py.
# Kept here because every cost comparison in this file depends on which row
# you divide by, and that choice was doing silent work for weeks.
[caliber]
settled = "2026-08-06, L3.32-F0"
unit = "obligation (top-level type signature), with where-local results counted separately"
tool = "scripts/obligations.py"
retiring_lines_per_obligation = 56.5
surviving_lines_per_obligation = 22.4
ratio_per_line = 5.3
ratio_per_named_result = 4.2
ratio_per_top_level_obligation = 2.1
controlled_single_module = "L.Rud.Bridge 939 s -> 199 s, 4.7x, mathematics held fixed, caliber cancels"
note = "The controlled per-module experiment is the instrument; the cross-tree ratio is not, because one engineering fix on one module exceeds the whole cross-tree gap at the fairest simple caliber."

