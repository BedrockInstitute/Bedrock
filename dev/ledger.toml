# never delete). Standing = tracked total MINUS these. Each entry is a path
# prefix or an exact path; scripts/ledger.py verifies every one still exists,
# which is what catches a stale declaration.
#
# NOTE: the R5-era census (_build/l3.31-r5census.md) books a DIFFERENT set,
# because it was written under the J-trophy route. D18 rules the actual set:
# under it the bridge SURVIVES as the wing's corollary, while the census
# retires it. When the two disagree, D18 wins and this file follows D18.
#
# CORRECTED 2026-08-05 by [T72], and the error was this file's: SatSets was listed here
# under 'the rud coded cluster', copied from the R5 census. The report D18 was actually
# ruled on (_build/l3.31-lt-report.md:26-27) puts the coded cluster at exactly four files,
# CodeSet + CodePred + StepInL + BaseBlock, and lists SatSets on the RETAINED row as one of
# the bridge's suppliers (full-switch at SatSets:1650). It never should have been condemned.
# Removing it takes 1,289 lines back into standing and dissolves three of the nine
# retirement crossings at a stroke.
# ---------------------------------------------------------------------------

