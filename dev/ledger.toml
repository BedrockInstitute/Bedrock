# Bedrock size ledger: the canonical DATA.
#
# The prose that explains this file lives in the section below, moved here when
# dev/LEDGER.md was deleted on 2026-08-06; this line pointed at that deleted
# file until then. The tool that reads it is scripts/ledger.py, which
# MEASURES standing from the tree rather than trusting any number written here.
# That split exists because of a measured failure: the register carried a
# standing figure of 12,633 for nine dispatches, and [L3.32-T55] found it had
# never been a measurement at all, only a projection fixed at [T25] and then
# re-quoted. Nothing in this file is a standing figure. Standing is measured.
#
# Caliber convention (PLAN section 6.2): a size figure is the count of non-blank
# lines inside ```agda fences, over git-tracked *.lagda.md under src/.
#
# THE PER-TROPHY CALIBER, added 2026-08-07 by [L3.32-T135].
# The owner asked how many lines the AC trophy needs alone. The answer has
# four parts. Part 1 is everything outside L. Part 2 is the L content only AC
# needs. Part 3 is the L content both trophies need.
#
# Part 4 is the L content only GCH needs. The AC total is parts 1 to 3.
# Part 4 exists for the check only. The four parts sum to the tracked total.
# scripts/ledger.py computes the parts from the import graph. It writes no
# part here.
#
# THE TROPHY MATRIX, added 2026-08-07 by [L3.32-T137].
# Every remaining row carries a trophy field: AC, GCH or BOTH.
# A row is BOTH when it is genuinely shared, and also when it is unsure.
# The endpoint for one trophy is that trophy's standing plus the rows it needs.
# The three columns do not add up, and they must not.
# scripts/ledger.py computes the nine cells. It writes no cell here.

# ---------------------------------------------------------------------------
# WHAT THIS FILE IS, AND THE THREE THINGS A READER MUST KNOW BEFORE EDITING IT.
#
# Moved here 2026-08-06 from dev/LEDGER.md, which is deleted. That document was
# 44 percent a generated rendering of this file and the rest was prose for the
# owner, who now reads the dashboard (`make dashboard`). [L3.32-T115] found
# exactly three passages in it that had no other home; they are below, because
# a rule with no home is a rule that stops being followed.
#
# 1. THE CALIBER, AND ITS CONSEQUENCES.
#    A size figure is the count of NON-BLANK LINES INSIDE ```agda FENCES, over
#    git-tracked *.lagda.md under src/. Each consequence below has bitten:
#      - Prose is NOT counted. A chapter's English and Chinese text costs real
#        effort and appears nowhere here; the trilingual burden is an excluded
#        row.
#      - The archive is NOT counted. archive/ sits outside src/ precisely so
#        every gate is structurally blind to it (D20). Retired code leaves this
#        ledger when it is archived.
#      - Probes are NOT counted, because probe files are never committed (D-1)
#        and the script reads only git-tracked files. A probe that measured 395
#        lines contributes nothing to standing, which is correct: it was thrown
#        away.
#      - A file being in the tree does not mean it is standing. See `retire`.
#
# 2. HOW A ROW GOES MISSING, and it is not by being deleted.
#    [L3.32-T91] walked the whole chain from the delivered tree to the sentence
#    L models GCH and found the theorem's own proof steps were not on this
#    list. Devlin 5.5 and 5.6 had been booked as rows; a later re-itemization
#    replaced them with two narrower items and NOBODY CHECKED THAT THE
#    REPLACEMENT COVERED THE SAME GROUND. The proof content simply stopped
#    being tracked, four smaller items went the same way, and the sentence
#    itself turned out to be stated nowhere in the tree.
#    THE LESSON: a re-itemization is a place where scope leaks. Replacing two
#    rows with two different rows looks like bookkeeping and is a scope change.
#    When a row is split, merged or restated, the replacement must be checked
#    to cover what the original covered, and the check must be recorded. The
#    gate cannot do this one: it verifies that every row has a provenance and a
#    band, not that the rows together still cover the theorem.
#
# 3. STANDING IS MEASURED, NEVER WRITTEN DOWN.
#    There is no standing figure in this file and there must never be one.
#    `scripts/ledger.py` measures it from HEAD. A standing figure once written
#    into prose was re-quoted unchecked for nine dispatches while the tree moved
#    under it. Quote `python3 scripts/ledger.py --brief`, never a number found
#    in a paragraph.
#
# WHAT THE GATE CANNOT CHECK, AND A CONTRIBUTOR THEREFORE OWES:
#    - When a chapter lands, its work moves from a `remaining` row to standing.
#      Standing updates itself; the remaining row does not. Narrow or close the
#      row in the same commit, and say whether the chapter came in inside its
#      band. A chapter landing over its band without that being recorded is
#      exactly how an endpoint rises without anyone deciding it should.
#    - When a gate returns, move its row's class from x3 toward x1.3 if it went
#      green, and record what the red left if it did not. That reclassification
#      is the whole economic point of gating.
# ---------------------------------------------------------------------------


[basis]
# What the measurement counts, so a figure can never drift basis silently.
unit = "non-blank lines inside ```agda fences"
scope = "git-tracked *.lagda.md under src/"
reference_line = 25000
reference_line_note = """
The reference line is a best-effort compression target, NOT a decision
procedure (PLAN decision D26). An overage is recorded in both calibers and
worked down where real compression exists. Evidence may move a technique; a
number alone moves nothing, and it may never put the campaign route back on
the table.
"""

