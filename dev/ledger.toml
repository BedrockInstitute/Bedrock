# THE BASELINE IS A MEASUREMENT, and the tool refuses to run without it.
# Protocol: interface cache moved aside, `make typecheck` at the exported
# GHCRTS default, Agda 2.8.0, single process, nothing else running,
# /usr/bin/time -p. The same protocol as [timing].measured_wall, so the two
# figures are comparable.
# RE-MEASURED 2026-08-11, and the trigger was a cure in a file nobody thought
# was AC-side. [LJ-1.31] made consAtL constant-free in L.Coding.Environment,
# +110 in-fence lines, and that file sits in the Landmarks cone. The guard
# below fired on a 109-line drift and REFUSED the old figure, exactly as it was
# built to. See dev/LESSONS.md C-32, admitted the same day for the other half
# of this lesson: a cure invalidates every downstream measurement.
#
# THE RESULT IS WORTH READING TWICE. The cone gained 109 lines and got FASTER
# in absolute seconds: 133.71 s implied by the old pair, 133.45 s measured now.
# The rate fell from 0.007913 to 0.007847. P-q says a line lever is not a
# seconds lever, and here it moved the two terms in OPPOSITE directions. Do not
# read the 0.26 s as a saving; it is inside noise. Read it as evidence that
# 110 lines of constant-free reader cost nothing to check.
#
# RE-MEASURED 2026-08-13 by [LJ-1.128]. The guard fired on a 179-line drift,
# which is [LJ-1.122]'s generic environment-set in L.Coding.EnvSet and
# L.Coding.Sound, added beside the numeral version and not replacing it. The
# new figure is 0.008793 s per line, 151.11 s over 17,185 lines, five cold
# runs: 150.24 / 149.33 / 154.11 / 153.31 / 148.56, spread 5.55 s, every exit
# 0. Against 0.007847 that is plus 12.05 percent.
#
# ALMOST NONE OF THAT RISE IS THE CONTENT, and a control run proves it rather
# than argues it. I built the OLD tree, commit f48ffd7, cold on this machine on
# this day: 149.06 and 147.85 s, mean 148.46, over its own 17,006 lines, which
# a run of ledger.py in that worktree confirmed. Its recorded figure is
# 133.45 s. So the IDENTICAL tree costs 11.2 percent more seconds today than it
# did on 2026-08-11. The machine moved, not the mathematics.
#
# WHAT THE 179 LINES COST, on one instrument on one day: 151.11 s against
# 148.46 s, plus 2.65 s or 1.79 percent, against a 5.55 s run-to-run spread.
# The kernel counters are sharper than the wall clock, and they agree:
# 1.940e12 instructions retired against 1.928e12, plus 0.62 percent, for plus
# 1.05 percent of lines. P-q again, in the good direction: the added lines are
# cheaper to check than the tree's mean line.
#
# THE MACHINE WAS NOT QUIET, and no tool can see this defect. `ps -Ao pcpu`
# during the runs showed GF-Trader at about 82 percent across two helpers,
# Bitcoin-Qt at 49, WindowServer at 28 and three WebKit renderers at about 25
# each. The CPU CLOCK WAS NOT THE CAUSE: 4.02 to 4.05 GHz on every run, no
# thermal warning, AC power, peak resident set 1.18 GiB. The instructions per
# cycle fell instead, a measured 3.20 to 3.25 today against an implied 3.57 on
# 2026-08-11, which is what memory contention does to this workload. The 3.57
# assumes the clock was the same that day, and no counter was recorded then.
#
# SO THE BAR IS ABOUT 11 PERCENT LOOSE, AND THE DIRECTION MATTERS. A baseline
# measured under load lets a wing module spend seconds it should not. The
# figure below is still written as MEASURED, because that is what the
# instrument said, and a paper rescale is exactly what this guard refuses. The
# normalization is recorded here instead, for a reader who needs it: 0.007847
# times 151.11 over 148.46 is 0.007987. RE-MEASURE ON A QUIET MACHINE before
# DD24 judges any wing module against this number.
ac_baseline_seconds_per_line = 0.008793

