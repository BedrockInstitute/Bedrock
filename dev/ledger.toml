# ============================================================================
# [reuse] -- DD4'S REPORT. NOT A GATE, AND THERE IS NO THRESHOLD HERE.
#
# DD4 makes maximum shared code the route's core constraint and the owner
# ruled it gets NO hard metric: a shared-line count used as a pass-or-fail
# would be gamed the moment it gated anything, because code can be moved into
# a shared module without either proof needing it there, and the number rises
# while the architecture gets worse.
#
# [LJ-0.3] then drew the distinction the first ruling missed: refusing the
# GATE is right, refusing the REPORT is one step too far. A report cannot be
# gamed, because nothing passes or fails on it, and the machinery to compute
# it already exists (scripts/measure/ledger.py's import closures). The owner adopted
# that on 2026-08-09. So this block declares the two roots and
# `ledger.py --reuse` prints what the two proofs actually share.
#
# WHAT THE NUMBER IS, AND WHAT IT IS NOT. It is the intersection of the two
# endpoints' import closures, in masters and in lines, with each side's own
# total. It is evidence for a human judging an architecture. It is NOT a
# score to maximize: a high share achieved by fattening the shared core is
# exactly the failure the no-gate ruling protects against. Read it beside the
# reuse map that [LJ-3.1] produces, never instead of it.
[reuse]
ac_root = "src/L/Model.lagda.md"
ac_root_why = "the delivered AC endpoint, L models ZFC, at Model.lagda.md:99"

