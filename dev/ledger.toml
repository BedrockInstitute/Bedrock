# The two endpoints are `L ⊨ ZFC` (whose open half is AC) and `L ⊨ GCH`. This
# table answers "what is actually left", which the line rows above deliberately
# do not: a row can be large and unblocking, or small and on the critical path,
# and the difference is not visible in a band.
#
# It exists because the technical route keeps moving. Every refutation in this
# campaign has changed what one of the two trophies still needs, and a reader
# who only had the line rows would not have seen that.
#
# Fields. `trophy` is AC, GCH, or BOTH. `status` is one of:
#   delivered   done and standing
#   ready       nothing blocks it; it can be dispatched now
#   in-flight   an agent holds it
#   blocked     something named in `blocked_by` must land first
#   at-risk     delivered, but on machinery that is scheduled to retire
# `evidence` cites the report or file that establishes the claim. An item with
# no evidence is a guess and must say so in its title.
#
# Updated with the ledger, at every return that could move it (D27).
# ---------------------------------------------------------------------------

