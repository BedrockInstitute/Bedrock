#
# THE PARAGRAPH THAT STOOD HERE IS OVERTAKEN AND ITS READING WAS REVERSED, so
# it is replaced rather than left to mislead. It recorded the share FALLING
# 41.1 to 39.1 percent when L.Axioms.Infinity became shared. The restatement
