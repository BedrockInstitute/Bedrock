notes = "The isContr notion, read in this book as unique existence. The nominal forms 可缩性 and 可縮性 are audited so that automatic matching links the whole word. Owner ruling 2026-09-12."

[[term]]
category = "Type theory"
id = "proposition"
audience = "reader"
en = "proposition"
zh = "命题"
ja = "命題"
introduced_in = "Base.Prelude"
matching = "explicit"
forms_en = ["propositions"]
recap_en = "A type any two of whose elements are equal, so that it retains only whether a proof exists."
recap_zh = "任意两个元素都相等的类型，因此只保留是否存在证明这一信息。"
recap_ja = "任意の二つの元が等しい型であり、証明が存在するかどうかだけを保つ。"
notes = "The isProp notion. Explicit matching, measured 2026-09-12: in Chinese 246 of 950 occurrences (26%) and in Japanese 291 of 973 (30%) sit inside a different term, chiefly 命题截断 / 命題的切り詰め, 命题值 / 命題値, 命题性 / 命題性 and 命题降层. English is unaffected because the word boundary excludes propositional, but matching is one decision for all three languages."

[[term]]
category = "Type theory"
id = "h-set"
audience = "reader"
en = "h-set"
zh = "h-集合"
ja = "h-集合"
introduced_in = "Base.Prelude"
matching = "auto"
forms_en = ["h-sets"]
presence = true
recap_en = "A type whose equality types are propositions: elements may differ, but any two proofs that they are equal agree."
recap_zh = "相等类型都是命题的类型：元素之间可以有差别，但同一对元素的任意两个相等证明彼此相等。"
recap_ja = "等しさの型がすべて命題である型。元は互いに異なりうるが、同じ二元が等しいことの証明は互いに一致する。"
notes = "A type whose identity types are propositions, also called a set or 0-type. English: https://homotopytypetheory.org/book/ section 3.1; Japanese 集合 (set / h-set): https://elpinal.gitlab.io/notes/bicat-of-adjunctions.pdf definition 1.3. The prefixed CJK forms distinguish this type from an element of V; the prefix is a composed notation, not a separately attested translation. Owner ruling 2026-09-12 unified the Chinese rendering on h-集合: the tree carried h-集 60 times, h-集合 twice and the bare Latin h-set 3 times, and all were converted the same day. Presence is enabled to keep the three editions parallel."

