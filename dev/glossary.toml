# ---- Added 2026-08-05 by owner ruling on the terminology dossier ----
# Dossier with sources, candidates and the explicit guessing list:
# dev/literature/terms-2026-08.md

[[term]]
category = "Logic"
en = "face"
zh = "面孔"
ja = "顔"
notes = "Historical explanatory metaphor for one interpretation or use of an object, for example its satisfaction reading. 面孔 / 顔 are ordinary contextual translations, not cubical faces. Prefer a mathematical description of the interpretation in new chapter headings."

[[term]]
category = "Set theory"
en = "initial segment"
zh = "初始段"
ja = "始切片"
avoid = ["zh:初段"]
notes = "Canonical book labels for the segment below an element of an ordered set. Japanese 始切片 is used in Tsuboi’s model-theory notes, https://www.math.tsukuba.ac.jp/~tsuboi/gra/lecturenote%2812%29.pdf . The historical review cites 数学辞海 vol. 1 p. 624 for Chinese; that printed page was not independently inspected in this web review. 初段 remains an excluded house variant, not a word declared mathematically meaningless."

[[term]]
category = "Type theory"
en = "presentation"
zh = "呈现"
ja = "提示"
notes = "A set presented by an index type and an indexing map, as in the cumulative-hierarchy HIT. Retain 呈现 / 提示 as editorial contextual renderings distinct from representation. Exact CJK usage for this particular HIT data was not established by the searches; no claim of direct attestation is made."

[[term]]
category = "Logic"
en = "crossing"
zh = "跨越"
ja = "越境"
notes = "Moving a statement between an ambient reading and an inner one, as in Delta-0 is a crossing tax. Metaphor, no source; 横断 collides with transversal."

[[term]]
category = "Logic"
en = "decode"
zh = "解码"
ja = "復号"
notes = "解码 and 译码 are both attested and the prose does not drift; 解码 is fixed here to keep it that way."

[[term]]
category = "Set theory"
en = "order type"
zh = "序型"
ja = "順序型"
avoid = ["zh:序类型"]
notes = "Established: 数学辞海 vol. 1 p. 624; 点集拓扑学. 序类型 is the encyclopedic long form, not wrong but not ours."

[[term]]
category = "Set theory"
en = "canonical well-ordering"
zh = "典范良序"
ja = "正準整列順序"
notes = "Composes the glossary's own 典范 and 良序; attested in 代数学方法 and university set-theory notes."

[[term]]
category = "Set theory"
en = "square law"
zh = "平方律"
ja = "平方律"
avoid = ["zh:平方定理"]
notes = "The cardinal identity that an infinite ordinal is equinumerous with its square. The project proves it in L.Ordinal.SquareLaw. 平方律 is a descriptive short title, not claimed to be a standard Chinese theorem name; distinguish the separate square-pairing function."

[[term]]
category = "Set theory"
en = "equinumerous"
zh = "等势"
ja = "対等"
avoid = ["zh:等数"]
notes = "Sets admitting a bijection. Japanese 対等 is directly used with this definition in https://hosho.ees.hokudai.ac.jp/tsuyu/top/dct/math-j.html . The historical review cites 数学辞海 vol. 4 for 等势; that printed volume was not independently inspected here. Retain 等势 as the house label without claiming that competing terms have no source."

[[term]]
category = "Set theory"
en = "initial ordinal"
zh = "初始序数"
ja = "始順序数"
notes = "Established: 数学辞海 vol. 1 p. 626."

[[term]]
category = "Logic"
en = "count"
zh = "计数"
ja = "数え上げ"
notes = "Ordinary established mathematical vocabulary (组合计数, 计数原理), used here as the subject of how many formulas there are."

[[term]]
category = "Logic"
en = "shape count"
zh = "形状计数"
ja = "形状の数え上げ"
notes = "Counting constant-free formula shapes at a fixed arity. This is a project compound of shape and counting; exact-phrase searches did not establish a named theorem with this title."

[[term]]
category = "Logic"
en = "square pairing"
zh = "平方配对"
ja = "平方対関数"
notes = "The pairing function on natural numbers used to count formula shapes. The title is a descriptive compound for this implementation, distinct from the infinite-cardinal square law. It names a function, not the identity itself."

[[term]]
category = "Logic"
en = "pair atom"
zh = "对原子"
ja = "対原子"
avoid = ["zh:对子原子"]
notes = "An object-language formula recognizing singleton, unordered-pair or ordered-pair structure. 对原子 / 対原子 are local compounds based on atomic-formula vocabulary; no claim of a standard theorem name. 对子原子 is excluded for consistency."

[[term]]
category = "Logic"
en = "frame"
zh = "框架"
ja = "フレーム"
notes = "D35 pipeline: T152 dossier, T153 review PASS 2026-08-07. A reusable formula shape in the internal language. ja per the Nagoya TPP2024 slides, not ja Wikipedia (T153 corrected the citation)."

[[term]]
category = "Logic"
en = "disjunction"
zh = "析取"
ja = "論理和"
notes = "D35 pipeline: T152 dossier, T153 review PASS 2026-08-07. Every cited source held, including kotobank."

[[term]]
category = "Set theory"
en = "slice"
zh = "切片"
ja = "スライス"
avoid = ["zh:像片"]
notes = "D35 pipeline: T152 dossier, T153 review PASS 2026-08-07. 像片 means photograph and is REJECTED; it had drifted into Images:460 and StepGraph while 切片 held 15 sites."

[[term]]
category = "Other"
en = "landing site"
zh = "落点"
ja = "着地点"
notes = "D35 pipeline: T152 dossier, T153 review PASS 2026-08-07. Project vocabulary: where future content will land."

[[term]]
category = "Logic"
en = "graph layer"
zh = "图层"
ja = "グラフレイヤー"
avoid = ["ja:グラフ層"]
notes = "Owner-delegated ruling 2026-08-07 (T152/T153). ja 層 is the sheaf headword and sheaves on graphs are a live object (T153 section 2), so the katakana layer carries the architecture sense. zh keeps 图层 with a modifier at first use per chapter (运算图层 style), because the bare word is lexicalized for image layers."

[[term]]
category = "Set theory"
en = "membership formula"
zh = "隶属公式"
ja = "帰属論理式"
avoid = ["ja:所属式"]
notes = "A formula expressing membership. Japanese is a composed label based on 帰属関係を表す論理式 in https://dspace.jaist.ac.jp/dspace/bitstream/10119/17662/5/paper.pdf . The shortened compound 帰属論理式 is editorial, not claimed verbatim. 所属 is valid ordinary membership prose; 所属式 remains an excluded rival label for this particular formula."

[[term]]
category = "Logic"
en = "equality frame"
zh = "等词框架"
ja = "等号フレーム"
notes = "Owner-delegated ruling 2026-08-07 (T152/T153). zh 等词 attested by 张清宇 (12 instances, 带等词的语言) and the BUAA syllabus (等词公理), both found by the T153 review after the dossier's sources broke. The division of labour: 等号 names the sign, 等词 the predicate; this frame argues about the predicate."

[[term]]
category = "Set theory"
en = "transitive carrier"
zh = "传递载体"
ja = "推移的台"
notes = "A carrier closed under membership. 推移的台 is the compact compound; 推移的な台 is also allowed in a sentence. The grammatical pattern 推移的な集合 is explicitly used in https://www.math.is.tohoku.ac.jp/~obata/student/subject/TaikeiBook/Taikei-Book_14.pdf . The carrier compound remains pattern-derived; terminology checks must not ban a natural adjectival construction."

[[term]]
category = "Logic"
en = "read lemma"
zh = "读引理"
ja = "読み補題"
notes = "Project expression for a lemma recovering the mathematical meaning of a coded formula. 读引理 / 読み補題 are editorial compounds. Targeted searches did not identify a primary source naming this local lemma family; that is not a claim that literature is silent."

[[term]]
category = "Other"
en = "survivor"
zh = "存活"
ja = "存続"
avoid = ["ja:生存ホーム", "ja:生存モジュール"]
notes = "Owner-delegated ruling 2026-08-07 (T152/T153). Project vocabulary: what remains after a retirement. ja 生存 rejected: 生存ホーム reads as a care facility (T153 section 9); 存続 carries the institutional-continuation sense. Attributive forms: 存続モジュール, 存続する章."

[[term]]
category = "Other"
en = "master"
zh = "主章"
ja = "原本"
avoid = ["ja:主章"]
notes = "Owner-delegated ruling 2026-08-07 (T152/T153). The canonical trilingual source file of a chapter. ja 主章 rejected: it reads as the principal chapter; マスター rejected as IT register. 原本, the document original, matches one-master-per-module with woven copies."

[[term]]
category = "Other"
en = "wing"
zh = "GCH 侧"
ja = "GCH 側"
avoid = ["zh:机翼"]
notes = "Historical project metaphor for the GCH part of the development. GCH 侧 / GCH 側 are transparent contextual renderings, not technical mathematical terms. Prefer the actual mathematical topic in new learner-facing headings. The English entry does not require renaming internal identifiers."

[[term]]
category = "Teaching terminology"
en = "set-theoretic reflection"
zh = "集合论反射"
ja = "集合論的反映"
avoid = ["ja:集合論的反射"]
notes = "Set-theoretic reflection is 反映 in Japanese; the principle is 反映原理, unlike programming reflection. Fuchino, footnote 4: https://math.cs.kitami-it.ac.jp/~fuchino/shizuoka/lss07_fuchinox0902.pdf ; https://elecello.com/doc/set/set0000.pdf ."

[[term]]
category = "Teaching terminology"
en = "Skolem hull"
zh = "Skolem 壳"
ja = "Skolem 包"
avoid = ["zh:Skolem 包", "ja:Skolem 殻"]
notes = "Direct terminology: Chinese 壳 (personal name may be kept Latin) https://studiesinlogic.sysu.edu.cn/sites/default/files/2023-09/1674-3202%282020%29-04-0012-19.pdf ; Japanese Skolem 包 https://konn-san.com/2024-forcing-seminar-notes/01-basic-mathematical-logic.pdf . Chinese Skolem 闭包 is also attested (Fudan summer notes), but 壳 is the selected house form."

[[term]]
category = "Teaching terminology"
en = "Mostowski collapse"
zh = "Mostowski 塌缩"
ja = "Mostowski 崩壊"
avoid = ["zh:Mostowski 坍缩"]
notes = "Japanese theorem name directly attested: https://math.cs.kitami-it.ac.jp/~fuchino/shizuoka/lss07_fuchinox0902.pdf . Queries Mostowski 塌缩 / Mostowski 坍缩 site:edu.cn did not establish a primary Chinese hit; 塌缩 is retained as a contextual rendering of the standard English construction, not claimed directly attested here."

[[term]]
category = "Teaching terminology"
en = "adequate stage"
zh = "充分层"
ja = "十分な段階"
avoid = ["zh:适足阶段", "zh:適足階段", "zh:适足层"]
notes = "Local predicate collecting the closure conditions in L.GCH.AdequateStages, not an admissible ordinal. Queries constructibility adequate Devlin and superadequate set theory did not establish this predicate as a standard named notion. Translations are descriptive compounds; distinguish semantic adequacy (充分性/妥当性). Concept context: https://onlinelibrary.wiley.com/doi/abs/10.1002/malq.201500072 ."

[[term]]
category = "Teaching terminology"
en = "superadequate stage"
zh = "超充分层"
ja = "強化された十分な段階"
avoid = ["zh:超适足阶段", "zh:超适足层", "ja:超十分"]
notes = "Project-local strengthening of adequate stage. Japanese deliberately describes the strengthening rather than inventing 超十分. Same search and mathematical context as adequate stage; this phrase does not claim a literature theorem."

[[term]]
category = "Teaching terminology"
en = "cardinal representative"
zh = "基数代表"
ja = "基数代表"
notes = "Descriptive compound for the initial ordinal representing an ordinal cardinality. Not claimed as a separately named theorem. Pattern from cardinal and ordinal comparison: https://ocw.cds.tohoku.ac.jp/wp-content/uploads/2025/09/5_cardinal.pdf ."

[[term]]
category = "Teaching terminology"
en = "coded injection"
zh = "编码单射"
ja = "符号化された単射"
avoid = ["zh:符号化注入", "ja:コード化された単射"]
notes = "Composed expression for a graph in the model representing an injective function. Searches coded injection set theory and 論理式 符号化 found no fixed three-language expression. Japanese 符号化 pattern: https://www.kurims.kyoto-u.ac.jp/~kenkyubu/kokai-koza/terui.pdf ; injection pattern: https://ocw.cds.tohoku.ac.jp/wp-content/uploads/2025/09/5_cardinal.pdf ."

[[term]]
category = "Teaching terminology"
en = "successor cardinal"
zh = "后继基数"
ja = "後続基数"
avoid = ["ja:後者基数"]
notes = "Direct Japanese cardinal term: https://www.kurims.kyoto-u.ac.jp/~kyodo/kokyuroku/contents/pdf/2151-06.pdf . Distinguish the successor operation 後者, attested https://www.sw.it.aoyama.ac.jp/2019/Math1/lecture2.html ."

[[term]]
category = "Teaching terminology"
en = "satisfaction table"
zh = "满足关系表"
ja = "充足関係表"
notes = "Project compound from satisfaction relation plus table, not the propositional truth table. Japanese 充足関係: https://www.jaist.ac.jp/~y-keita/I211-2020/I211-lecnote.pdf ."

[[term]]
category = "Teaching terminology"
en = "bounded subset theorem"
zh = "有界子集定理"
ja = "有界部分集合定理"
notes = "Descriptive local theorem name for bounding a constructible subset by an ordinal stage. Pattern rather than a claimed standard title. Standard constructibility argument context: https://elecello.com/doc/set/set0006.pdf ."


[[term]]
category = "Type theory"
en = "propositional truncation"
zh = "命题截断"
ja = "命題的切り詰め"
notes = "English: HoTT Book section 3.7, https://homotopytypetheory.org/book/ . Japanese compound follows Uemura’s attested n 切り詰め (n-truncation), section 4.3, https://uemurax.github.io/hott-ja/index.pdf ; searches for the exact compound found reading notes but no primary exact compound, so this is pattern-derived. Chinese compound is a descriptive rendering of proposition + truncation; exact-phrase searches did not yield a primary Chinese text. This is the (-1)-truncation, not the choice of an inhabitant."

[[term]]
category = "Logic"
en = "arity"
zh = "元数"
ja = "アリティ"
notes = "Japanese logical usage: Aoto, definition 10.4, https://www.nue.ie.niigata-u.ac.jp/~aoto/lecture/21Logic.done/lecture10.pdf . Chinese 元数 follows n 元 predicate/function terminology; searches for exact bilingual primary sources did not identify a stronger variant. For Formula K n in this project n counts available variable positions, not necessarily the number of variables occurring in a formula."

[[term]]
category = "Logic and philosophy"
en = "constant"
zh = "常元"
ja = "定数"
avoid = ["zh:常量符号", "zh:常量出现"]
notes = "First-order syntax, not an arbitrary fixed quantity. Wang Wei uses 常元符号 throughout languages, interpretation and expansion by parameters: https://logic.fudan.edu.cn/doc/Event/2024/summer/FMOA0727.pdf . Japanese 定数記号: https://www.jaist.ac.jp/~y-keita/I211-2020/I211-lecnote.pdf . 常量符号 also occurs in teaching literature, for example https://basics.sjtu.edu.cn/~yangqizhe/pdf/dm2025w/slides/DMLec5-handout.pdf ; the chosen stem is a consistency decision, not a claim that the alternative is wrong. Do not apply this rendering to constant functions or fixed numerical quantities."

[[term]]
category = "Set theory"
en = "stage"
zh = "层"
ja = "段階"
notes = "An individual step L_α in the construction, distinguished from the whole constructible hierarchy and from its ordinal index α. Chinese 层 approved by the owner on 2026-09-10: Yang Ruizhi calls L_α 每一层结构 in 多宇宙观幻觉, PDF p. 2, https://logic.fudan.edu.cn/doc/_yrz/multi.pdf . Use 第 α 层, 后继层, 极限层; keep universe level as 宇宙层级. 阶段 remains appropriate when describing a phase of the construction rather than naming L_α, so it is not globally banned. Japanese 段階 is unchanged; Japanese literature often writes L_α within the directly attested L-階層. See dev/literature/stage-level-hierarchy.md."

[[term]]
category = "Set theory"
en = "stage index"
zh = "层索引"
ja = "段階の添字"
notes = "The ordinal α indexing the stage L_α, not the set L_α and not the entire hierarchy. In L.Stage, stage x hx returns this ordinal, while stage-mem places x in Lset (stage x hx). The compound translations are descriptive and pattern-based; Chinese 层索引 follows stage = 层 (owner approval, 2026-09-10). They are not claimed as fixed literature terms. See dev/literature/stage-level-hierarchy.md."

[[term]]
category = "Logic and philosophy"
en = "alphabet"
zh = "字母表"
ja = "アルファベット"
notes = "A set/type of symbols. English primary lecture usage: https://web.stanford.edu/class/archive/cs/cs143/cs143.1128/lectures/02/Slides02.pdf ; Japanese primary teaching usage: https://hwb.ecc.u-tokyo.ac.jp/wp/applications-2/textprocessing/regexp/automaton/ ; Chinese publisher excerpt: https://www.tup.tsinghua.edu.cn/upload/books/yz/023232-01.pdf . These attest the terminology, not a finiteness assumption for this project. Alphabet W supplies the available constant symbols from members of W; it need not be finite and is not the ten constructor tags."
