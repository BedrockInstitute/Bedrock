# dev/vendors.toml: the VENDOR DATA that the dispatch policy runs on.
#
# WHAT THIS FILE IS FOR. It names the vendor in force, the model ID that vendor
# runs, whether `pi` is wired to that vendor today, and the price bands the
# vendor bills on. `scripts/dispatch/dispatch_policy.py` reads it with `tomllib`.
#
# WHAT THIS FILE DOES NOT HOLD, AND THIS IS THE DD19 LINE. It holds NO head
# table, NO mode, NO case, NO tier token and NO invariant. THE HEAD TABLES LIVE
# IN `scripts/dispatch/dispatch_policy.py`, and `AGENTS.md` names that file the ONLY home
# of the tables. This file says WHEN a vendor is dear. That file says WHICH MODE
# each price band selects. Neither one states the other.
#
# DELETE THIS FILE AND NOTHING BREAKS. `scripts/dispatch/dispatch_policy.py` then uses its
# built-in default vendor, which holds the data the code carried before this
# config existed. That default is a compatibility floor, not a second home: when
# this file exists it wins completely, and no field merges into it from the
# default.
#
# THE CAVEAT, from the repository owner, 2026-08-15. `pi` is wired to deepseek
# and to no other vendor today. This file opens compatibility before the need.
# It does not claim support that exists. A vendor row with `pi_wired = false` is
# a legal declaration, and `scripts/dispatch/dispatch_policy.py` refuses loudly when that
# vendor is in force and a head must start.
#
# NO FIELD HAS A SILENT DEFAULT, because an escape hatch is the shape a wrong
# choice hides in (`dev/LESSONS.md` C-43). Each vendor row is one of two kinds,
# and each kind has its own required fields. A field that belongs to the other
# kind is a refusal, never an ignored line.

# The vendor in force. It must match one `[vendors.<name>]` table below.
in_force = "zai"

# ---------------------------------------------------------------------------
# THE VENDOR ROWS. Every row declares these three fields:
#
#   model        the model ID the herdr heads run. It is never empty.
#   pi_provider  the provider name `pi` needs for this vendor.
#   pi_wired     true only if `pi` can really run this vendor today.
#
# A BANDED VENDOR bills different prices at different hours. It adds:
#
#   base_state   the band that holds outside every declared window.
#   windows      the hours the vendor bills at another band, in Beijing time.
#                Each window names its band, its start and its end. A window is
#                half-open [start, end), so 09:00 is peak and 12:00 is off-peak.
#                The windows are ordered by start time and they never overlap.
#
# A FLAT VENDOR bills one price at every hour. It adds:
#
#   default_mode the mode that `VERSION_IN_FORCE = "auto"` resolves to. A flat
#                vendor gives the clock no basis, so the clock does not run.
#
# THE BAND NAMES ARE NOT FREE TEXT. `scripts/dispatch/dispatch_policy.py` maps each band
# to a mode in `CLOCK_STATES`, and it refuses a band that the map does not know.
# ---------------------------------------------------------------------------

[vendors.deepseek]
model = "deepseek-v4-pro"
pi_provider = "deepseek"
pi_wired = true
base_state = "off-peak"
# The other half of the mutual pair above.
pi_fallback = "zai"
windows = [
    { state = "peak", start = "09:00", end = "12:00" },
    { state = "peak", start = "14:00", end = "18:00" },
]

# ZAI, THE VENDOR IN FORCE SINCE 2026-08-15, on the owner's instruction.
#
# IT IS FLAT, not banded, because the owner holds a SUBSCRIPTION rather than
# per-hour pricing. A flat vendor gives the clock no basis, so `clock_state()`
# refuses to be read at all and `auto` resolves to `default_mode` below.
#
# THE PROVIDER IS `zai` AND NOT `glm`. MEASURED 2026-08-15: `pi auth check
# --provider glm` returns `provider_not_found`, and `pi --list-models` lists
# the GLM family under the provider `zai`. `pi auth check --provider zai
# --model glm-5.3` returns `{"status":"ready","authType":"api_key"}`, which is
# what `pi_wired = true` records.
#
# `default_mode` IS THE ORCHESTRATOR'S PICK AND THE OWNER HAS NOT RULED ON IT.
# The reason for `pi-subagent-mode`: the clock only ever existed because
# deepseek billed peak and off-peak, and a subscription has no such hours, so
# the head that led OFF-PEAK is the honest steady state. The adversarial row
# still sends its reviews in-harness, which DD17's invariant requires anyway.
# One line changes it.
[vendors.zai]
model = "glm-5.3"
pi_provider = "zai"
pi_wired = true
default_mode = "pi-subagent-mode"
# WITHIN pi, GLM AND DEEPSEEK ARE MUTUAL FALLBACKS (owner, 2026-08-15). When
# this vendor refuses, the same harness retries on the vendor named here before
# anything leaves `pi`. The chain then ends at `codex`, which is FIXED on
# deepseek and never carries this model.
pi_fallback = "deepseek"

# QWEN, ADDED 2026-08-16 ON THE OWNER'S INSTRUCTION. NOT IN FORCE.
#
# The owner asked for a qwen vendor wired to `pi`'s `qwen3.8-27b-mlx@8bit`.
# The row is added; `in_force` above is UNCHANGED, because they asked to add a
# vendor and not to switch to one.
#
# THE PROVIDER IS `mlxvlm`, CORRECTED 2026-08-16 ON THE OWNER'S INSTRUCTION
# AND RE-MEASURED THE SAME DAY. It is the same trap the zai row records one
# screen above, and this row fell into it twice.
#
# WHAT THIS ROW SAID FIRST, and it is kept because a reason is not a record to
# be tidied away: it read `lmstudio`, on a measurement taken earlier the same
# day in which `pi auth check --provider lmstudio` returned `ready` and
# `--provider qwen` returned `invalid`.
#
# WHAT `pi` ANSWERS NOW, re-run at the correction:
#   pi auth check --provider mlxvlm   --model qwen3.8-27b-mlx@8bit  -> ready
#   pi auth check --provider lmstudio --model qwen3.8-27b-mlx@8bit  -> invalid
# The two answers are exactly reversed. `pi --list-models` lists the model
# under `mlxvlm`, and the CONFUSION HAS A CAUSE worth writing down: the model
# file lives under LM Studio's own directory
# (`~/.lmstudio/models/Youssofal/Qwen3.8-27B-MTPLX-Optimized-Speed`), so the
# storage path names LM Studio while the pi provider does not.
#
# `pi_wired = true` records the `mlxvlm` reading and nothing older.
#
# ONE THING IS NOT SETTLED AND THIS FILE DOES NOT INVENT IT. `pi --list-models`
# now prints the model column as that absolute path rather than as
# `qwen3.8-27b-mlx@8bit`, while `auth check` still answers `ready` for the
# short ID. The model ID is the owner's to supply, so the short ID stands and
# the discrepancy is reported rather than guessed.
#
# IT IS FLAT, and for a reason the other rows do not have: it runs LOCALLY, so
# it bills no hours at all. A local model gives the clock no basis, exactly as
# a subscription does. The runtime is NOT named here: only the provider name
# and the model's storage path were measured, and this row said "through LM
# Studio" on the strength of that path until 2026-08-16.
#
# WHAT `pi --list-models` MEASURED, 2026-08-16: context 262.1K, max output
# 32.8K, thinking NO, images NO. The thinking column is the one that bears on
# dispatch: this head cannot be asked for extended reasoning, so it is not a
# candidate for the adversarial row whatever a mode table says.
#
# `default_mode` IS DORMANT HERE AND THE OWNER HAS NOT RULED ON IT. It is read
# only when `VERSION_IN_FORCE = "auto"`, and the pin is `pi-subagent-mode`
# today, so this field decides nothing until both change. It carries
# `pi-subagent-mode` to match the other flat vendor rather than to assert a
# judgement about this head.
#
# NO `pi_fallback`. deepseek and zai name each other because the owner ruled
# them a mutual pair on 2026-08-15. Nobody has ruled a fallback for this
# vendor, and an invented one would write a certainty no evidence gives.
[vendors.qwen]
model = "qwen3.8-27b-mlx@8bit"
pi_provider = "mlxvlm"
pi_wired = true
default_mode = "pi-subagent-mode"

# ---------------------------------------------------------------------------
# HOW TO ADD A VENDOR. Copy one template below, fill the model ID, and set
# `in_force` above.
#
# THE MODEL ID IS THE OWNER'S TO SUPPLY. This file ships no glm row and no grok
# row, because an invented model ID writes a certainty that no evidence gives.
# A row is added when its model ID is known, not before.
#
# A FLAT VENDOR, which is every vendor that does not price by the hour:
#
#   [vendors.glm]
#   model = "<the model ID, from the vendor>"
#   pi_provider = "glm"
#   pi_wired = false
#   default_mode = "in-harness-subagent-mode"
#
# A VENDOR WITH THREE PRICE BANDS declares two of them and names the third as
# its base:
#
#   [vendors.example]
#   model = "<the model ID, from the vendor>"
#   pi_provider = "example"
#   pi_wired = false
#   base_state = "off-peak"
#   windows = [
#       { state = "peak", start = "09:00", end = "12:00" },
#       { state = "super-peak", start = "14:00", end = "18:00" },
#   ]
#
# A NEW BAND NAME NEEDS ONE NEW ROW IN `CLOCK_STATES`, in
# `scripts/dispatch/dispatch_policy.py`. That row says which mode the band selects. That
# is a policy decision about heads, so it belongs in the policy file and not
# here. This is the DD19 line again, seen from the other side.
# ---------------------------------------------------------------------------
