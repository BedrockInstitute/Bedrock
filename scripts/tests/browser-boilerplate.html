const delay = ms => new Promise(r=>setTimeout(r,ms));
const results=[];
function check(ok,name,detail) {
  results.push({ok:Boolean(ok),name,detail});

  fetch('/results',{method:'POST',body:JSON.stringify(results)});
  if (!ok) throw new Error(name+': '+JSON.stringify(detail));
}
async function until(fn) {
  for(let i=0;i<150;i++){const value=fn();if(value)return value;await delay(100)}
  throw new Error('Timeout '+fn.toString());

const tap = node => {
  node.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerType:'touch'}));

  check(getComputedStyle(loader).backgroundColor===getComputedStyle(body).backgroundColor,theme+' loading canvas matches modal background');
  check(frame.hasAttribute('inert') && getComputedStyle(frame).opacity==='0',theme+' pending iframe cannot paint or take focus');
  check(frame.style.colorScheme===theme,theme+' iframe initial color scheme matches reader');
}

  const ending=mobileDoc.querySelector('article > pre.Agda:has(> .agda-definition-end)');
  const codeRect=ending.getBoundingClientRect();
  const qedRect=ending.querySelector('.agda-definition-end').getBoundingClientRect();
  check(qedRect.left>codeRect.left && qedRect.right<codeRect.right && qedRect.bottom<codeRect.bottom,'390px QED floats inside its code frame');
  const qedStyle=narrow.contentWindow.getComputedStyle(ending.querySelector('.agda-definition-end'),'::after');
  check(parseFloat(qedStyle.opacity)>0 && parseFloat(qedStyle.opacity)<.6 && qedStyle.pointerEvents==='none','QED is translucent non-interactive frame decoration');
  const ordinary=[...mobileDoc.querySelectorAll('article > pre.Agda')][0].getBoundingClientRect();
  check(Math.abs(ordinary.left-codeRect.left)<1 && Math.abs(ordinary.right-codeRect.right)<1,'ordinary and QED code blocks share both horizontal edges');
  const folds=[...mobileDoc.querySelectorAll('.submodule-fold')];
  check(folds.every(fold=>{
    const blocks=[...fold.querySelectorAll('pre.Agda')].filter(pre=>pre.closest('.submodule-fold')===fold && !pre.closest('.submodule-fold-heading'));
    const reference=blocks[0].getBoundingClientRect();
    return blocks.every(pre=>{const rect=pre.getBoundingClientRect();return Math.abs(rect.left-reference.left)<1 && Math.abs(rect.right-reference.right)<1});
  }),'each submodule aligns its own body code edges');
  check(folds.every(fold=>{
    const header=fold.querySelector(':scope > .submodule-fold-heading'), pre=header.querySelector('pre.Agda');
    const style=narrow.contentWindow.getComputedStyle(pre), headingStyle=narrow.contentWindow.getComputedStyle(header);
    return !pre.querySelector('.agda-code-content') && parseFloat(style.paddingRight)<4
      && style.borderWidth==='0px' && parseFloat(headingStyle.marginLeft)===0 && parseFloat(headingStyle.marginRight)===0;
  }),'fold declarations retain their original compact style without body-code gutters');
  check(folds.every(fold=>parseFloat(narrow.contentWindow.getComputedStyle(fold).borderLeftWidth)>0 && fold.querySelector('pre.Agda').getBoundingClientRect().left>codeRect.left),'submodules preserve their frame and indentation relative to outer code');
  check(narrow.contentWindow.getComputedStyle(ending.querySelector('.agda-definition-end'),'::after').content==='"∎"' && parseFloat(narrow.contentWindow.getComputedStyle(ending.querySelector('.agda-definition-end'),'::after').fontSize)>0,'QED retains its original Unicode glyph');
  check(narrow.contentWindow.getComputedStyle(ending).marginBottom===narrow.contentWindow.getComputedStyle(mobileDoc.querySelector('article > pre.Agda:not(:has(.agda-definition-end))')).marginBottom,'semantic endings use ordinary frame spacing');
  const badge=mobileDoc.querySelector('.chapter-review').getBoundingClientRect();
  const chapterHeading=mobileDoc.querySelector('h1').getBoundingClientRect();
  check(badge.left>=chapterHeading.right && badge.right<=narrow.contentWindow.innerWidth,'390px review icon occupies the title row right edge');
  await until(()=>mobileDoc.querySelector('.compact-done'));
  const mobileSummary=mobileDoc.querySelector('.compact-summary');
  const mobileTitle=mobileSummary.querySelector('.compact-summary-title').getBoundingClientRect();
  const mobileDone=mobileSummary.querySelector('.compact-done').getBoundingClientRect();
  check(mobileDone.left>=mobileTitle.right && mobileDone.right<=narrow.contentWindow.innerWidth,'390px completion control fits beside route title');
  testPointer.matches=false;
  function hovered(node,value) {
    if (!node.originalMatches) node.originalMatches=node.matches.bind(node);
    node.matches=selector=>selector===':hover' ? value : node.originalMatches(selector);
  }
  hovered(title,true);title.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}));
  const desktopRoot=await until(()=>popups()[0]);
  hovered(title,false);hovered(desktopRoot,true);
  desktopRoot.dispatchEvent(new MouseEvent('mouseenter'));
  const keyword=desktopRoot.querySelector('[data-hover-help]');
  hovered(keyword,true);keyword.dispatchEvent(new MouseEvent('mouseover',{bubbles:true}));
  const desktopChild=await until(()=>popups()[1]);
  hovered(keyword,false);hovered(desktopRoot,false);hovered(desktopChild,true);
  desktopRoot.dispatchEvent(new MouseEvent('mouseleave'));
  desktopChild.dispatchEvent(new MouseEvent('mouseenter'));
  await delay(450);
  check(popups().length===2,'desktop ancestor survives while nested popup is hovered');
  hovered(desktopChild,false);desktopChild.dispatchEvent(new MouseEvent('mouseleave'));
  await delay(100);
  check(popups().length===2,'desktop chain retains its exit delay');
  hovered(desktopChild,true);desktopChild.dispatchEvent(new MouseEvent('mouseenter'));
  await delay(400);
  check(popups().length===2,'brief exit and re-entry cancel the entire close chain');
  hovered(desktopChild,false);desktopChild.dispatchEvent(new MouseEvent('mouseleave'));
  await until(()=>popups().length===0);
  check(!title.classList.contains('info-active'),'leaving nested hover closes ancestors and clears the source cue');
  document.querySelector('#test-status').textContent='PASS '+results.length+'/'+results.length+' browser boilerplate and modal checks';
} catch(error) {
  document.querySelector('#test-status').textContent='FAIL '+error.message;
  fetch('/results',{method:'POST',body:'ERROR '+error.stack});
} finally {
  if (savedTheme === null) localStorage.removeItem('bedrock-theme');
  else localStorage.setItem('bedrock-theme', savedTheme);
}
});
</script></body></html>
