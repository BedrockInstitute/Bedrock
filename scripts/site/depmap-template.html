<style>
#dependency-map {
  --depmap-panel: var(--text-bg);
  --depmap-soft: color-mix(in srgb, var(--surface-muted, var(--code-bg)) 70%, var(--text-bg));
  --depmap-lane: color-mix(in srgb, var(--surface-muted, var(--code-bg)) 35%, var(--text-bg));
  --depmap-lane-alt: color-mix(in srgb, var(--surface-muted, var(--code-bg)) 65%, var(--text-bg));
  --depmap-line: var(--ruler); --depmap-edge-dim: .18;
  color: var(--text-fg); font-family: var(--sans);
}
#dependency-map [hidden] { display: none !important; }
#dependency-map .depmap-root { min-width: 0; display: flex; flex-direction: column; gap: .65rem; }
#dependency-map .depmap-head { display: flex; gap: 1rem; justify-content: space-between; align-items: center; }
#dependency-map .depmap-head h2 { margin: 0; font-size: 1.4rem; }
#dependency-map .depmap-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
#dependency-map label { display: inline-flex; align-items: center; gap: .5rem; }
#dependency-map :is(button, select, input[type=search]) {
  box-sizing: border-box; min-height: 44px; max-width: 100%; border: 1px solid var(--input-border);
  border-radius: 8px; padding: .45rem .65rem; background: var(--depmap-panel);
  color: var(--text-fg); font: inherit; font-size: .85rem;
}
#dependency-map button { cursor: pointer; }
#dependency-map button:hover { background: var(--button-hover); border-color: var(--primary); }
#dependency-map button:disabled { opacity: .45; cursor: default; }
#dependency-map :is(button, select, input, summary, .depmap-scroll):focus-visible {
  outline: 2px solid var(--primary); outline-offset: 3px;
}
#dependency-map .depmap-node:focus-visible rect { stroke: var(--primary); stroke-width: 3; }
#dependency-map .depmap-search { flex: 1; min-width: min(100%, 12rem); }
#dependency-map .depmap-search input { width: 100%; min-width: 0; font-size: 1rem; }
#dependency-map .depmap-options { border-block: 1px solid var(--depmap-line); }
#dependency-map summary { cursor: pointer; min-height: 44px; align-content: center; font-size: .85rem; }
#dependency-map .depmap-options-body { padding: .25rem 0 .8rem; max-height: 32dvh; overflow: auto; }
#dependency-map .depmap-sub, #dependency-map .depmap-note {
  color: var(--fg-alt); font-size: .8rem; line-height: 1.6; margin: .5rem 0;
}
#dependency-map .depmap-radio { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0; }
#dependency-map .depmap-radio label, #dependency-map .depmap-landmark { min-height: 44px; font-size: .85rem; }
#dependency-map input { accent-color: var(--primary); }
#dependency-map .depmap-legend { display: flex; flex-wrap: wrap; gap: .6rem 1rem; margin: .5rem 0; font-size: .8rem; }
#dependency-map .depmap-legend-list { display: flex; flex-wrap: wrap; gap: .5rem 1rem; }
#dependency-map .depmap-chip { display: inline-flex; align-items: center; gap: .35rem; }
#dependency-map .depmap-dot { width: .6rem; height: .6rem; border-radius: 50%; }
#dependency-map .depmap-scroll {
  position: relative; height: clamp(22rem, 65dvh, 50rem); min-height: 180px;
  overflow: hidden; touch-action: none; overscroll-behavior: contain; user-select: none;
  border: 1px solid var(--depmap-line); border-radius: 10px; background: var(--depmap-panel);
  cursor: grab;
}
#dependency-map .depmap-scroll.is-dragging { cursor: grabbing; }
#dependency-map .depmap-scroll > svg { display: block; width: 100%; height: 100%; }
#dependency-map .depmap-lane-label { font: 600 12px var(--sans); fill: var(--fg-alt); }
#dependency-map .depmap-node rect { rx: 7; stroke-width: 1.2; cursor: pointer; }
#dependency-map .depmap-node text { cursor: pointer; }
#dependency-map .depmap-label { font: 500 13px var(--mono); }
#dependency-map .depmap-order { font: 600 10px var(--sans); }
#dependency-map .depmap-edge { fill: none; }
#dependency-map .depmap-node.is-faded { opacity: .2; }
#dependency-map .depmap-node.is-pinned rect { stroke-width: 3; }
#dependency-map .depmap-view-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; }
#dependency-map .depmap-view-controls output { color: var(--fg-alt); font-size: .8rem; font-variant-numeric: tabular-nums; min-width: 3.2rem; text-align: center; }
#dependency-map .depmap-info { border-left: 3px solid var(--primary); padding: .5rem .75rem; max-height: 28dvh; overflow: auto; }
#dependency-map .depmap-info h3 { font-size: 1rem; margin: 0; overflow-wrap: anywhere; }
#dependency-map .depmap-info a { color: var(--link-color); }
#dependency-map .depmap-meta { font: .75rem var(--mono); color: var(--fg-alt); overflow-wrap: anywhere; }
#dependency-map .depmap-info p { margin: .4rem 0; font-size: .85rem; }
#dependency-map .depmap-deps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(15rem, 100%), 1fr)); gap: .5rem; font-size: .8rem; }
#dependency-map .depmap-deps span { overflow-wrap: anywhere; }
#dependency-map .depmap-fullscreen {
  box-sizing: border-box; position: fixed; inset: 0; margin: 0; width: 100vw; max-width: none;
  height: 100dvh; max-height: none; border: 0; background: var(--text-bg); color: var(--text-fg);
  padding: max(.75rem, env(safe-area-inset-top)) max(.75rem, env(safe-area-inset-right))
           max(.75rem, env(safe-area-inset-bottom)) max(.75rem, env(safe-area-inset-left));
}
#dependency-map .depmap-fullscreen .depmap-root { height: 100%; }
#dependency-map .depmap-fullscreen .depmap-scroll { flex: 1; height: auto; }
html.depmap-expanded { overflow: hidden; }
@media (max-width: 44rem) {
  #dependency-map .depmap-controls { font-size: .85rem; }
  #dependency-map .depmap-search { flex-basis: 100%; }
  #dependency-map .depmap-head h2 { font-size: 1.2rem; }
  #dependency-map .depmap-info { max-height: 22dvh; }
}
@media (max-height: 500px) {
  #dependency-map .depmap-fullscreen { overflow: auto; }
  #dependency-map .depmap-fullscreen .depmap-root { height: auto; min-height: 100%; }
  #dependency-map .depmap-fullscreen .depmap-scroll { flex: none; height: 65dvh; }
}
</style>

<div class="depmap-root" data-depmap-root>
  <header class="depmap-head"><h2 id="depmap-title">__TITLE__</h2>
    <button type="button" data-depmap-fullscreen aria-expanded="false">__FULLSCREEN__</button>
  </header>
  <div class="depmap-controls">
    <label><span class="sr-only">__LAYOUT__</span><select data-depmap-layout>
      <option value="namespace">__NAMESPACE__</option><option value="compact">__COMPACT__</option>
      <option value="teaching">__TEACHING__</option>
    </select></label>
    <label class="depmap-search"><span class="sr-only">__SEARCH__</span>
      <input type="search" data-depmap-search list="depmap-chapters" placeholder="__SEARCH__" autocomplete="off">
      <datalist id="depmap-chapters"></datalist>
    </label>
  </div>
  <details class="depmap-options">
    <summary>__OPTIONS__</summary>
    <div class="depmap-options-body">
      <p class="depmap-sub">__SUB__</p>
      <div class="depmap-radio" role="radiogroup" aria-label="__EDGEMODE__">
        <label><input type="radio" name="depmap-edgemode" value="skeleton" checked> __SKELETON__</label>
        <label><input type="radio" name="depmap-edgemode" value="all"> __ALLEDGES__</label>
      </div>
      <label class="depmap-landmark"><input type="checkbox" data-depmap-landmark checked> __LMK__</label>
      <div class="depmap-legend"><span>__LEGEND__</span><span class="depmap-legend-list" data-depmap-legend></span></div>
      <p class="depmap-note" id="depmap-help">__SCROLLHINT__</p>
      <div class="depmap-controls" role="group" aria-label="__PAN__">
        <button type="button" data-depmap-pan="-1,0" aria-label="__LEFT__">←</button>
        <button type="button" data-depmap-pan="0,-1" aria-label="__UP__">↑</button>
        <button type="button" data-depmap-pan="0,1" aria-label="__DOWN__">↓</button>
        <button type="button" data-depmap-pan="1,0" aria-label="__RIGHT__">→</button>
      </div>
      <p class="depmap-note">__HUBNOTE__ __FOOTER__</p>
    </div>
  </details>
  <noscript><p>__NOSCRIPT__ <a href="#reading-explorer">__CATALOG__</a>.</p></noscript>
  <div class="depmap-scroll" data-depmap-scroll tabindex="0" aria-label="__TITLE__" aria-describedby="depmap-help"></div>
  <div class="depmap-view-controls" role="group" aria-label="__TITLE__">
    <button type="button" data-depmap-out aria-label="__ZOOMOUT__">−</button>
    <output data-depmap-scale aria-label="__TITLE__">100%</output>
    <button type="button" data-depmap-in aria-label="__ZOOMIN__">+</button>
    <button type="button" data-depmap-zoom>__FIT__</button>
    <button type="button" data-depmap-readable>1:1</button>
  </div>
  <section class="depmap-info" data-depmap-card aria-live="polite" hidden>
    <h3><a data-depmap-name>__HINT__</a></h3>
    <div class="depmap-meta" data-depmap-meta hidden></div>
    <p data-depmap-desc hidden></p>
    <details><summary>__DETAILS__</summary><div class="depmap-deps" data-depmap-deps hidden></div></details>
  </section>
</div>

<script>
(() => {
  "use strict";
  const root = document.querySelector("#dependency-map [data-depmap-root]");
  if (!root || root.dataset.initialised) return;
  root.dataset.initialised = "true";
  const DATA = __DATA__, STR = __STR__;
  const svgNS = "http://www.w3.org/2000/svg", NODEW = 128, NODEH = 34;
  const byId = {}; DATA.nodes.forEach(node => byId[node.id] = node);
  const hubs = new Set(DATA.hubs), short = id => id.split(".").pop();
  const scroll = root.querySelector("[data-depmap-scroll]");
  const layoutControl = root.querySelector("[data-depmap-layout]");
  const landmarkControl = root.querySelector("[data-depmap-landmark]");
  const zoomControl = root.querySelector("[data-depmap-zoom]");
  let pinned = null, fitWhole = false, camera = { x: 0, y: 0, scale: 1 };
  let suppressClick = false, graphSvg = null;
  const scaleOutput = root.querySelector('[data-depmap-scale]');
  function paintCamera() {
    if (!graphSvg || !scroll.clientWidth || !scroll.clientHeight) return;
    graphSvg.setAttribute('viewBox', `${camera.x} ${camera.y} ${scroll.clientWidth / camera.scale} ${scroll.clientHeight / camera.scale}`);
    scaleOutput.value = `${Math.round(camera.scale * 100)}%`;
    root.querySelector('[data-depmap-in]').disabled = camera.scale >= 4;
    root.querySelector('[data-depmap-out]').disabled = camera.scale <= .04;
  }
  function zoomAt(scale, x = scroll.clientWidth / 2, y = scroll.clientHeight / 2) {
    const next = Math.max(.04, Math.min(4, scale));
    camera.x += x / camera.scale - x / next;
    camera.y += y / camera.scale - y / next;
    camera.scale = next; fitWhole = false; paintCamera();
  }
  function fit() {
    const layout = DATA.layouts[layoutControl.value];
    camera.scale = Math.max(.04, Math.min(1, (scroll.clientWidth - 24) / layout.width,
      (scroll.clientHeight - 24) / layout.height));
    camera.x = (layout.width - scroll.clientWidth / camera.scale) / 2;
    camera.y = (layout.height - scroll.clientHeight / camera.scale) / 2;
    fitWhole = true; paintCamera();
  }
  function pan(x, y) { camera.x += x / camera.scale; camera.y += y / camera.scale; fitWhole = false; paintCamera(); }
  function centerNode(id) {
    const pos = DATA.layouts[layoutControl.value].positions[id];
    camera.scale = Math.max(1, camera.scale);
    camera.x = pos.x + NODEW / 2 - scroll.clientWidth / camera.scale / 2;
    camera.y = pos.y + NODEH / 2 - scroll.clientHeight / camera.scale / 2;
    fitWhole = false; paintCamera();
  }

  const laneStyle = document.createElement("style");
  const light = DATA.lanes.map((lane, i) => `--depmap-color-${i}:${lane.light};`).join("");
  const dark = DATA.lanes.map((lane, i) => `--depmap-color-${i}:${lane.dark};`).join("");
  laneStyle.textContent = `#dependency-map{${light}}html.theme-dark #dependency-map{${dark}}` +
    `@media(prefers-color-scheme:dark){html:not(.theme-light) #dependency-map{${dark}}}`;
  root.prepend(laneStyle);
  const laneColor = {}; DATA.lanes.forEach((lane, i) => laneColor[lane.key] = `var(--depmap-color-${i})`);

  root.querySelector("[data-depmap-legend]").replaceChildren(...DATA.lanes.map((lane, i) => {
    const chip = document.createElement("span"); chip.className = "depmap-chip";
    const dot = document.createElement("span"); dot.className = "depmap-dot";
    dot.style.background = `var(--depmap-color-${i})`;
    const label = document.createElement("span"); label.className = "depmap-mono"; label.textContent = lane.key;
    chip.append(dot, label); return chip;
  }));

  const consumersOf = {}, importsOf = {};
  DATA.nodes.forEach(node => { consumersOf[node.id] = []; importsOf[node.id] = []; });
  DATA.edges.forEach(([a, b]) => { consumersOf[a].push(b); importsOf[b].push(a); });
  function cone(start, adjacency) {
    const seen = new Set(), pending = [...(adjacency[start] || [])];
    while (pending.length) {
      const next = pending.pop();
      if (!seen.has(next)) { seen.add(next); (adjacency[next] || []).forEach(item => pending.push(item)); }
    }
    return seen;
  }
  function allEdgesMode() {
    return root.querySelector('input[name="depmap-edgemode"]:checked').value === "all";
  }
  function syncLandmarkControl() {
    const visible = allEdgesMode();
    landmarkControl.closest(".depmap-landmark").hidden = !visible;
  }
  function visibleEdges() {
    const showLandmark = allEdgesMode() && landmarkControl.checked;
    let edges = DATA.edges.filter(([a, b]) => !hubs.has(a) && (showLandmark || b !== DATA.landmark));
    if (root.querySelector('input[name="depmap-edgemode"]:checked').value === "skeleton") {
      const adjacency = {}; edges.forEach(([a, b]) => (adjacency[a] = adjacency[a] || []).push(b));
      edges = edges.filter(([a, b]) => {
        const rest = { ...adjacency, [a]: (adjacency[a] || []).filter(item => item !== b) };
        return !cone(a, rest).has(b);
      });
    }
    return edges;
  }
  function camelWords(label) {
    const words = label.match(/[A-Z]+(?=[A-Z][a-z]|[0-9]|$)|[A-Z]?[a-z]+|[0-9]+/g);
    return words && words.join("") === label ? words : [label];
  }
  function labelLines(label, hasOrder) {
    const words = camelWords(label), candidates = [[label]];
    for (let i = 1; i < words.length; i++) candidates.push([words.slice(0, i).join(""), words.slice(i).join("")]);
    const capacity = lines => Math.min(...lines.map((line, i) =>
      (lines.length === 2 && i === 0 && hasOrder ? 92 : 112) / line.length));
    return candidates.reduce((best, lines) => {
      const score = capacity(lines), bestScore = capacity(best);
      return score > bestScore || (score === bestScore && lines.length < best.length) ? lines : best;
    });
  }
  function fitNodeLabel(label, rect, order) {
    for (let pass = 0; pass < 4; pass++) {
      const box = rect.getBBox(), orderBox = order ? order.getBBox() : null;
      let scale = 1;
      for (const line of label.children) {
        const lineBox = line.getBBox(); let right = box.x + box.width - 8;
        const sharesOrderRow = orderBox &&
          Math.min(orderBox.y + orderBox.height, lineBox.y + lineBox.height) > Math.max(orderBox.y, lineBox.y);
        if (sharesOrderRow) right = Math.min(right, orderBox.x - 5);
        if (lineBox.x + lineBox.width > right) scale = Math.min(scale, (right - lineBox.x) / lineBox.width);
      }
      if (scale >= 1) return;
      label.style.fontSize = `${parseFloat(label.style.fontSize) * scale * .995}px`;
    }
  }
  function resetCard() {
    root.querySelector('[data-depmap-card]').hidden = true;
    const link = root.querySelector("[data-depmap-name]"); link.textContent = STR.hint; link.removeAttribute("href");
    const meta = root.querySelector("[data-depmap-meta]"); meta.textContent = ""; meta.hidden = true;
    const desc = root.querySelector("[data-depmap-desc]"); desc.textContent = ""; desc.hidden = true;
    const deps = root.querySelector("[data-depmap-deps]"); deps.replaceChildren(); deps.hidden = true;
    root.querySelector("[data-depmap-card]").style.borderLeftColor = "var(--ruler)";
  }
  function showCard(id) {
    root.querySelector('[data-depmap-card]').hidden = false;
    const node = byId[id], link = root.querySelector("[data-depmap-name]");
    /* The address travels with the node, from scripts/site/reading_routes.py. A
       preview chapter has no page of its own, so a filename built from the id here
       would point at nothing. */
    link.textContent = node.title; link.href = node.page + node.anchor;
    root.querySelector("[data-depmap-card]").style.borderLeftColor = laneColor[node.lane];
    const meta = root.querySelector("[data-depmap-meta]");
    meta.textContent = `${node.id} · ${node.stage} · ${STR.reading} ${String(node.ord).padStart(2, "0")}`;
    meta.hidden = false;
    const desc = root.querySelector("[data-depmap-desc]"); desc.textContent = node.desc; desc.hidden = false;
    const deps = root.querySelector("[data-depmap-deps]"); deps.replaceChildren(); deps.hidden = false;
    for (const [label, items] of [[STR.imports, importsOf[id]], [STR.consumers, consumersOf[id]]]) {
      const group = document.createElement("div"), heading = document.createElement("b");
      heading.textContent = `${label} (${items.length})`; group.append(heading, document.createElement("br"));
      const list = document.createElement("span");
      if (!items.length) list.textContent = STR.none;
      items.forEach((other, i) => {
        if (i) list.append(' · ');
        const a = document.createElement('a'); a.href = byId[other].page + byId[other].anchor;
        a.textContent = byId[other].title; a.title = other; list.append(a);
      });
      group.append(list); deps.append(group);
    }
  }
  function render(preserveScroll = false) {
    if (!root.getClientRects().length) return;
    const edges = visibleEdges(), layout = DATA.layouts[layoutControl.value];
    const { width, height, positions } = layout, svg = document.createElementNS(svgNS, "svg");
    graphSvg = svg;
    svg.setAttribute('width', '100%'); svg.setAttribute('height', '100%');
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    scroll.replaceChildren(svg);
    layout.bands.forEach((band, i) => {
      const rect = document.createElementNS(svgNS, "rect");
      for (const key of ["x", "y", "width", "height"]) rect.setAttribute(key, band[key]);
      rect.setAttribute("fill", i % 2 ? "var(--depmap-lane-alt)" : "var(--depmap-lane)"); svg.append(rect);
      const text = document.createElementNS(svgNS, "text"); text.setAttribute("x", band.x + 14);
      text.setAttribute("y", band.y + 21); text.setAttribute("class", "depmap-lane-label");
      text.textContent = band.label; svg.append(text);
    });
    const defs = document.createElementNS(svgNS, "defs"), marker = document.createElementNS(svgNS, "marker");
    marker.setAttribute("id", "depmap-dependency-arrow"); marker.setAttribute("viewBox", "0 0 6 6");
    marker.setAttribute("refX", "6"); marker.setAttribute("refY", "3"); marker.setAttribute("markerWidth", "5");
    marker.setAttribute("markerHeight", "5"); marker.setAttribute("orient", "auto");
    const arrow = document.createElementNS(svgNS, "path"); arrow.setAttribute("d", "M0 0 L6 3 L0 6 Z");
    arrow.setAttribute("fill", "var(--fg-alt)"); marker.append(arrow); defs.append(marker); svg.append(defs);
    const edgeElements = [];
    edges.forEach(([a, b]) => {
      const p1 = positions[a], p2 = positions[b], x1 = p1.x + NODEW / 2, y1 = p1.y + NODEH;
      const x2 = p2.x + NODEW / 2, y2 = p2.y, dy = Math.max(26, (y2 - y1) * .45);
      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`);
      path.setAttribute("class", "depmap-edge"); path.setAttribute("marker-end", "url(#depmap-dependency-arrow)");
      path.setAttribute("stroke", laneColor[byId[a].lane]); path.setAttribute("opacity", "var(--depmap-edge-dim)");
      path.dataset.a = a; path.dataset.b = b; svg.append(path); edgeElements.push(path);
    });
    const nodeElements = {};
    DATA.nodes.forEach(node => {
      const group = document.createElementNS(svgNS, "g"); group.setAttribute("class", "depmap-node");
      group.dataset.id = node.id; group.setAttribute("tabindex", "0"); group.setAttribute("role", "button");
      group.setAttribute("aria-pressed", String(pinned === node.id));
      group.setAttribute("aria-label", `${node.title} · ${node.id}: ${node.desc}`);
      const title = document.createElementNS(svgNS, "title"); title.textContent = node.id; group.append(title);
      const { x, y } = positions[node.id], rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", NODEW); rect.setAttribute("height", NODEH);
      rect.setAttribute("fill", "var(--depmap-panel)"); rect.setAttribute("stroke", laneColor[node.lane]); group.append(rect);
      const label = document.createElementNS(svgNS, "text"), lines = labelLines(short(node.id), Boolean(node.ord));
      label.setAttribute("x", x + 8); label.setAttribute("fill", "var(--text-fg)");
      label.setAttribute("class", "depmap-label"); label.style.fontSize = "13px";
      lines.forEach((line, i) => {
        const span = document.createElementNS(svgNS, "tspan"); span.setAttribute("x", x + 8);
        span.setAttribute("y", lines.length === 1 ? y + 23 : y + 12 + i * 15);
        span.textContent = line; label.append(span);
      });
      group.append(label); svg.append(group);
      let order = null;
      if (node.ord) {
        order = document.createElementNS(svgNS, "text"); order.setAttribute("x", x + NODEW - 7);
        order.setAttribute("y", y + 11); order.setAttribute("text-anchor", "end");
        order.setAttribute("fill", laneColor[node.lane]); order.setAttribute("class", "depmap-order");
        order.textContent = String(node.ord).padStart(2, "0"); group.append(order);
      }
      fitNodeLabel(label, rect, order); nodeElements[node.id] = group;
    });
    function highlight(id) {
      const up = cone(id, importsOf), down = cone(id, consumersOf);
      Object.entries(nodeElements).forEach(([nodeId, element]) =>
        element.classList.toggle("is-faded", nodeId !== id && !up.has(nodeId) && !down.has(nodeId)));
      edgeElements.forEach(element => {
        const { a, b } = element.dataset;
        const active = ((up.has(a) || a === id) && (up.has(b) || b === id)) ||
          ((down.has(b) || b === id) && (down.has(a) || a === id));
        element.setAttribute("opacity", active ? ".9" : ".05");
        element.setAttribute("stroke-width", active ? "2.4" : "1.5");
      });
    }
    function clear() {
      if (pinned) { highlight(pinned); return; }
      Object.values(nodeElements).forEach(element => element.classList.remove("is-faded"));
      edgeElements.forEach(element => {
        element.setAttribute("opacity", "var(--depmap-edge-dim)"); element.setAttribute("stroke-width", "1.5");
      });
      resetCard();
    }
    Object.entries(nodeElements).forEach(([id, element]) => {
      element.addEventListener("mouseenter", () => { if (!pointers.size) highlight(id); });
      element.addEventListener("focus", () => {
        highlight(id);
        if (pointers.size) return;
        const pos = positions[id], w = scroll.clientWidth / camera.scale, h = scroll.clientHeight / camera.scale;
        if (pos.x < camera.x || pos.y < camera.y || pos.x + NODEW > camera.x + w || pos.y + NODEH > camera.y + h) centerNode(id);
      });
      element.addEventListener("blur", clear); element.addEventListener("mouseleave", clear);
      element.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault(); element.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
      });
      element.addEventListener("click", event => {
        event.stopPropagation(); pinned = pinned === id ? null : id;
        Object.entries(nodeElements).forEach(([nodeId, item]) => {
          const selected = nodeId === pinned;
          item.classList.toggle("is-pinned", selected); item.setAttribute("aria-pressed", String(selected));
        });
        if (pinned) { showCard(pinned); highlight(pinned); } else clear();
      });
    });
    svg.addEventListener("click", () => {
      pinned = null; Object.values(nodeElements).forEach(element => {
        element.classList.remove("is-pinned"); element.setAttribute("aria-pressed", "false");
      }); clear();
    });
    if (pinned) { nodeElements[pinned].classList.add("is-pinned"); showCard(pinned); highlight(pinned); }
    else resetCard();
    if (!preserveScroll) {
      camera = { x: Math.max(0, (width - scroll.clientWidth) / 2), y: 0, scale: 1 };
      fitWhole = false;
    }
    if (fitWhole) fit(); else paintCamera();
  }

  root.querySelectorAll('input[name="depmap-edgemode"]').forEach(control =>
    control.addEventListener("change", () => { syncLandmarkControl(); render(true); }));
  layoutControl.addEventListener("change", () => render());
  landmarkControl.addEventListener("change", () => render(true));
  zoomControl.addEventListener('click', fit);
  root.querySelector('[data-depmap-in]').addEventListener('click', () => zoomAt(camera.scale * 1.25));
  root.querySelector('[data-depmap-out]').addEventListener('click', () => zoomAt(camera.scale / 1.25));
  root.querySelector('[data-depmap-readable]').addEventListener('click', () => zoomAt(1));
  root.querySelector('[data-depmap-readable]').title = STR.readable;
  root.querySelectorAll('[data-depmap-pan]').forEach(button => button.addEventListener('click', () => {
    const [x, y] = button.dataset.depmapPan.split(',').map(Number); pan(x * 120, y * 120);
  }));

  // One camera for pointer, trackpad, Safari gesture, buttons and keyboard.
  // Touch-action is restricted to the canvas; the rest of the page keeps native gestures.
  const pointers = new Map();
  let start = null, last = null;
  function pointerState() {
    const points = [...pointers.values()].slice(0, 2), a = points[0], b = points[1] || a;
    return a && { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
      distance: points.length === 2 ? Math.hypot(a.x - b.x, a.y - b.y) : 0 };
  }
  scroll.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    if (!pointers.size) { suppressClick = false; start = { x: event.clientX, y: event.clientY }; }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size > 1) suppressClick = true;
    last = pointerState();
  });
  window.addEventListener('pointermove', event => {
    if (!pointers.has(event.pointerId)) return;
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    const now = pointerState();
    if (!suppressClick && Math.hypot(now.x - start.x, now.y - start.y) < 5) return;
    suppressClick = true; scroll.classList.add('is-dragging');
    if (!scroll.hasPointerCapture(event.pointerId)) {
      try { scroll.setPointerCapture(event.pointerId); } catch (_) { /* Pointer already ended or synthetic regression event. */ }
    }
    const rect = scroll.getBoundingClientRect();
    if (now.distance > 0 && last.distance > 0) zoomAt(camera.scale * now.distance / last.distance,
      last.x - rect.left, last.y - rect.top);
    pan(last.x - now.x, last.y - now.y); last = now;
  });
  function endPointer(event) {
    if (!pointers.has(event.pointerId)) return;
    pointers.delete(event.pointerId); last = pointerState();
    if (!pointers.size) { scroll.classList.remove('is-dragging'); start = null; }
    if (event.type === 'pointercancel') suppressClick = true;
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  scroll.addEventListener('lostpointercapture', endPointer);
  scroll.addEventListener('click', event => {
    if (suppressClick && event.detail !== 0) { event.preventDefault(); event.stopImmediatePropagation(); }
  }, true);
  let safariGesture = false, safariScale = 1;
  scroll.addEventListener('wheel', event => {
    event.preventDefault();
    if (safariGesture) return;
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? scroll.clientHeight : 1;
    if (event.ctrlKey || event.metaKey) {
      const rect = scroll.getBoundingClientRect();
      zoomAt(camera.scale * Math.exp(-event.deltaY * unit * .01), event.clientX - rect.left, event.clientY - rect.top);
    } else pan((event.shiftKey && !event.deltaX ? event.deltaY : event.deltaX) * unit,
      event.shiftKey && !event.deltaX ? 0 : event.deltaY * unit);
  }, { passive: false });
  scroll.addEventListener('gesturestart', event => {
    event.preventDefault(); if (pointers.size >= 2) return;
    safariGesture = true; safariScale = camera.scale;
  }, { passive: false });
  scroll.addEventListener('gesturechange', event => {
    event.preventDefault(); if (!safariGesture || pointers.size >= 2) return;
    const rect = scroll.getBoundingClientRect();
    zoomAt(safariScale * event.scale, event.clientX - rect.left, event.clientY - rect.top);
  }, { passive: false });
  scroll.addEventListener('gestureend', event => { event.preventDefault(); safariGesture = false; }, { passive: false });
  scroll.addEventListener('keydown', event => {
    const moves = { ArrowLeft: [-80, 0], ArrowRight: [80, 0], ArrowUp: [0, -80], ArrowDown: [0, 80] };
    if (moves[event.key]) pan(...moves[event.key]);
    else if (event.key === '+' || event.key === '=') zoomAt(camera.scale * 1.25);
    else if (event.key === '-') zoomAt(camera.scale / 1.25);
    else if (event.key === '0') fit();
    else return;
    event.preventDefault();
  });
  const search = root.querySelector('[data-depmap-search]');
  root.querySelector('#depmap-chapters').replaceChildren(...DATA.nodes.map(node => {
    const option = document.createElement('option'); option.value = node.id; option.label = node.title; return option;
  }));
  function findChapter() {
    const q = search.value.trim().toLocaleLowerCase();
    if (!q) return;
    const node = DATA.nodes.find(n => n.id.toLocaleLowerCase() === q || n.title.toLocaleLowerCase() === q)
      || DATA.nodes.find(n => `${n.id} ${n.title}`.toLocaleLowerCase().includes(q));
    if (!node) return;
    pinned = node.id; render(true); centerNode(pinned);
  }
  search.addEventListener('input', findChapter);
  search.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); findChapter(); scroll.focus(); } });

  const fullButton = root.querySelector('[data-depmap-fullscreen]');
  const fullDialog = document.createElement('dialog'); fullDialog.className = 'depmap-fullscreen';
  fullDialog.setAttribute('aria-labelledby', 'depmap-title');
  const home = root.parentNode, placeholder = document.createComment('graph home');
  home.insertBefore(placeholder, root); home.append(fullDialog);
  fullButton.addEventListener('click', () => {
    if (fullDialog.open) { fullDialog.close(); return; }
    fullDialog.append(root); document.documentElement.classList.add('depmap-expanded');
    fullButton.textContent = STR.exitfullscreen; fullButton.setAttribute('aria-expanded', 'true');
    fullDialog.showModal(); fullButton.focus();
    requestAnimationFrame(() => { if (fitWhole) fit(); else paintCamera(); });
  });
  fullDialog.addEventListener('close', () => {
    placeholder.after(root); document.documentElement.classList.remove('depmap-expanded');
    fullButton.textContent = STR.fullscreen; fullButton.setAttribute('aria-expanded', 'false');
    fullButton.focus(); requestAnimationFrame(() => { if (fitWhole) fit(); else paintCamera(); });
  });
  document.addEventListener('bedrock:tabchange', event => {
    if (event.detail?.id !== 'dependency-map' && fullDialog.open) fullDialog.close();
  });
  new ResizeObserver(() => { if (root.getClientRects().length) { if (fitWhole) fit(); else paintCamera(); } }).observe(scroll);
  syncLandmarkControl();
  if (root.getClientRects().length) render();
  if (document.fonts) document.fonts.ready.then(() => { if (root.getClientRects().length) render(true); });
  document.addEventListener("bedrock:tabchange", event => {
    if (!event.detail || event.detail.id !== "dependency-map") return;
    requestAnimationFrame(() => render(true));
  });
})();
</script>
