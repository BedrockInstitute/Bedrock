<style>
#dependency-map {
  --depmap-panel: var(--text-bg);
  --depmap-soft: color-mix(in srgb, var(--code-bg) 72%, var(--text-bg));
  --depmap-lane: color-mix(in srgb, var(--code-bg) 58%, var(--text-bg));
  --depmap-lane-alt: color-mix(in srgb, var(--code-bg) 82%, var(--text-bg));
  --depmap-line: color-mix(in srgb, var(--ruler) 62%, transparent);
  --depmap-edge-dim: .16;
  color: var(--text-fg); font-family: var(--sans);
}
#dependency-map .depmap-head h2 { margin: 0 0 .25rem; font-size: clamp(1.35rem, 3vw, 1.8rem); text-wrap: balance; }
#dependency-map .depmap-sub { margin: 0; max-width: 68ch; color: var(--fg-alt); font-size: .85rem; line-height: 1.5; }
#dependency-map .depmap-controls {
  display: flex; flex-wrap: wrap; gap: .55rem; align-items: center;
  margin: 1rem 0 .7rem; padding: .6rem; border: 1px solid var(--depmap-line);
  border-radius: 13px; background: color-mix(in srgb, var(--depmap-soft) 78%, var(--depmap-panel));
  box-shadow: 0 8px 20px color-mix(in srgb, var(--text-fg) 6%, transparent);
  font-size: .82rem; color: var(--fg-alt);
}
#dependency-map .depmap-controls > label:not(.depmap-landmark) { display: inline-flex; gap: .4rem; align-items: center; padding: .25rem .45rem; border-radius: 8px; }
#dependency-map .depmap-controls > label:not(.depmap-landmark) b { color: var(--text-fg); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
#dependency-map .depmap-controls input { accent-color: var(--primary); }
#dependency-map .depmap-radio {
  display: inline-flex; flex-wrap: wrap; gap: .25rem; align-items: center;
  padding: .22rem; border: 1px solid var(--depmap-line); border-radius: 10px;
  background: color-mix(in srgb, var(--depmap-panel) 80%, var(--depmap-soft));
}
#dependency-map .depmap-control-label { padding: .28rem .42rem; color: var(--text-fg); font-size: .72rem; font-weight: 700; letter-spacing: .03em; }
#dependency-map .depmap-radio label { position: relative; display: inline-flex; align-items: center; min-height: 1.8rem; padding: .28rem .52rem; border: 1px solid transparent; border-radius: 7px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
#dependency-map .depmap-radio label:has(input:checked) { border-color: color-mix(in srgb, var(--primary) 42%, var(--depmap-line)); background: var(--depmap-panel); color: var(--primary); font-weight: 700; box-shadow: 0 2px 7px color-mix(in srgb, var(--text-fg) 8%, transparent); }
#dependency-map .depmap-radio label:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px; }
#dependency-map .depmap-radio input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#dependency-map .depmap-landmark { display: inline-flex; align-items: center; gap: .42rem; min-height: 2.3rem; padding: .25rem .65rem; border: 1px solid var(--depmap-line); border-radius: 999px; background: var(--depmap-panel); cursor: pointer; }
#dependency-map .depmap-landmark:has(input:checked) { border-color: color-mix(in srgb, var(--primary) 42%, var(--depmap-line)); color: var(--primary); }
#dependency-map select, #dependency-map .depmap-zoom {
  appearance: none; border: 1px solid var(--input-border); border-radius: 8px; background: var(--text-bg);
  color: var(--text-fg); font: inherit; padding: .42rem .62rem; min-height: 2.3rem;
}
#dependency-map select { padding-right: 1.8rem; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - .85rem) .95rem, calc(100% - .6rem) .95rem; background-size: .25rem .25rem, .25rem .25rem; background-repeat: no-repeat; }
#dependency-map .depmap-zoom { cursor: pointer; font-weight: 700; }
#dependency-map .depmap-zoom:hover { border-color: var(--primary); background: var(--button-hover); }
#dependency-map .depmap-controls select:hover { border-color: var(--primary); }
#dependency-map select:focus-visible, #dependency-map input:focus-visible,
#dependency-map .depmap-zoom:focus-visible, #dependency-map .depmap-node:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent); outline-offset: 2px;
}
#dependency-map .depmap-legend { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem .8rem; margin: .45rem 0 .7rem; color: var(--fg-alt); font-size: .76rem; }
#dependency-map .depmap-legend-title { color: var(--text-fg); font-weight: 700; }
#dependency-map .depmap-legend-list { display: flex; flex-wrap: wrap; gap: .35rem .85rem; margin-top: .4rem; }
#dependency-map .depmap-chip { display: inline-flex; align-items: center; gap: .32rem; }
#dependency-map .depmap-dot { width: .58rem; height: .58rem; border-radius: 2px; display: inline-block; }
#dependency-map .depmap-mono { font-family: var(--mono); font-size: .88em; }
#dependency-map .depmap-info {
  border: 1px solid var(--depmap-line); border-left: 4px solid var(--ruler); border-radius: 8px;
  background: var(--depmap-panel); padding: .75rem .9rem; margin: .7rem 0;
}
#dependency-map .depmap-info h3 { margin: 0 0 .12rem; font: 700 .9rem/1.3 var(--mono); }
#dependency-map .depmap-info h3 a { color: var(--primary); text-decoration: none; }
#dependency-map .depmap-info h3 a:hover { text-decoration: underline; }
#dependency-map .depmap-meta { color: var(--fg-alt); font-size: .72rem; margin-bottom: .3rem; }
#dependency-map .depmap-info p { margin: .15rem 0 .35rem; max-width: 74ch; font-size: .82rem; line-height: 1.45; }
#dependency-map .depmap-deps {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(min(16rem, 100%), 1fr));
  gap: .25rem 1rem; font-size: .76rem;
}
#dependency-map .depmap-deps b { color: var(--fg-alt); }
#dependency-map .depmap-deps span { font-family: var(--mono); overflow-wrap: anywhere; }
#dependency-map .depmap-scroll-hint { margin: .45rem 0; color: var(--fg-alt); font-size: .75rem; }
#dependency-map .depmap-scroll {
  max-height: min(68vh, 42rem); overflow: auto; overscroll-behavior: contain;
  border: 1px solid var(--depmap-line); border-radius: 9px; background: var(--depmap-panel);
  scrollbar-gutter: stable both-edges;
}
#dependency-map .depmap-scroll.is-fit { display: grid; place-items: center; }
#dependency-map .depmap-scroll.is-fit svg { margin: auto; }
#dependency-map svg { display: block; }
#dependency-map .depmap-lane-label { font: 600 .72rem/1 var(--sans); letter-spacing: .09em; fill: var(--fg-alt); }
#dependency-map .depmap-node rect {
  rx: 6; stroke-width: 1.4; cursor: pointer; transition: opacity .15s ease, stroke-width .15s ease;
}
#dependency-map .depmap-node text { cursor: pointer; }
#dependency-map .depmap-node .depmap-label { font: 500 13px/1 var(--mono); }
#dependency-map .depmap-node .depmap-order { font: 600 .62rem/1 var(--sans); }
#dependency-map .depmap-edge { fill: none; stroke-width: 1.5; transition: opacity .15s ease, stroke-width .15s ease; }
#dependency-map .depmap-node.is-faded rect, #dependency-map .depmap-node.is-faded text { opacity: .18; }
#dependency-map .depmap-node.is-pinned rect { stroke-width: 3; }
#dependency-map .depmap-note { margin: .6rem 0 0; color: var(--fg-alt); font-size: .75rem; line-height: 1.45; }
#dependency-map .depmap-noscript { color: var(--fg-alt); font-size: .82rem; }
#dependency-map .depmap-noscript a { color: var(--primary); }
@media (max-width: 44rem) {
  #dependency-map .depmap-controls { align-items: stretch; gap: .4rem; }
  #dependency-map .depmap-controls > label:not(.depmap-landmark), #dependency-map .depmap-radio { flex: 1 0 100%; }
  #dependency-map .depmap-controls > label:not(.depmap-landmark) { justify-content: space-between; }
  #dependency-map .depmap-landmark, #dependency-map .depmap-zoom { flex: 1 0 auto; min-height: 2.5rem; }
  #dependency-map .depmap-scroll { max-height: 62vh; }
}
@media (prefers-reduced-motion: reduce) {
  #dependency-map .depmap-edge, #dependency-map .depmap-node rect { transition: none; }
}
</style>

<div class="depmap-root" data-depmap-root>
  <header class="depmap-head"><h2>__TITLE__</h2><p class="depmap-sub">__SUB__</p></header>
  <div class="depmap-controls">
    <label><b>__LAYOUT__</b><select data-depmap-layout>
      <option value="compact">__COMPACT__</option><option value="teaching">__TEACHING__</option>
      <option value="namespace">__NAMESPACE__</option>
    </select></label>
    <span class="depmap-radio" role="radiogroup" aria-label="__EDGEMODE__">
      <span class="depmap-control-label">__EDGEMODE__</span>
      <label><input type="radio" name="depmap-edgemode" value="skeleton" checked> __SKELETON__</label>
      <label><input type="radio" name="depmap-edgemode" value="all"> __ALLEDGES__</label>
    </span>
    <label class="depmap-landmark"><input type="checkbox" data-depmap-landmark checked> __LMK__</label>
    <button class="depmap-zoom" type="button" data-depmap-zoom aria-pressed="false">__FIT__</button>
  </div>
  <div class="depmap-legend"><span class="depmap-legend-title">__LEGEND__</span>
    <span class="depmap-legend-list" data-depmap-legend></span></div>
  <noscript><p class="depmap-noscript">__NOSCRIPT__ <a href="#reading-explorer">__CATALOG__</a>.</p></noscript>
  <section class="depmap-info" data-depmap-card aria-live="polite">
    <h3><a data-depmap-name>__HINT__</a></h3><div class="depmap-meta" data-depmap-meta hidden></div>
    <p data-depmap-desc hidden></p><div class="depmap-deps" data-depmap-deps hidden></div>
  </section>
  <p class="depmap-scroll-hint">__SCROLLHINT__</p>
  <div class="depmap-scroll" data-depmap-scroll tabindex="0" aria-label="__TITLE__"></div>
  <p class="depmap-note">__HUBNOTE__ __FOOTER__</p>
</div>

<script>
(() => {
  "use strict";
  const root = document.querySelector("#dependency-map [data-depmap-root]");
  if (!root || root.dataset.initialised) return;
  root.dataset.initialised = "true";
  const DATA = __DATA__, STR = __STR__;
  const svgNS = "http://www.w3.org/2000/svg", NODEW = 128, NODEH = 34;
  const byId = {}; DATA.nodes.forEach(node => byId[node.id] = node);
  const hubs = new Set(DATA.hubs), short = id => id.split(".").pop();
  const scroll = root.querySelector("[data-depmap-scroll]");
  const layoutControl = root.querySelector("[data-depmap-layout]");
  const landmarkControl = root.querySelector("[data-depmap-landmark]");
  const zoomControl = root.querySelector("[data-depmap-zoom]");
  let pinned = null, fitWhole = false;

  const laneStyle = document.createElement("style");
  const light = DATA.lanes.map((lane, i) => `--depmap-color-${i}:${lane.light};`).join("");
  const dark = DATA.lanes.map((lane, i) => `--depmap-color-${i}:${lane.dark};`).join("");
  laneStyle.textContent = `#dependency-map{${light}}html.theme-dark #dependency-map{${dark}}` +
    `@media(prefers-color-scheme:dark){html:not(.theme-light) #dependency-map{${dark}}}`;
  root.prepend(laneStyle);
  const laneColor = {}; DATA.lanes.forEach((lane, i) => laneColor[lane.key] = `var(--depmap-color-${i})`);

  root.querySelector("[data-depmap-legend]").replaceChildren(...DATA.lanes.map((lane, i) => {
    const chip = document.createElement("span"); chip.className = "depmap-chip";
    const dot = document.createElement("span"); dot.className = "depmap-dot";
    dot.style.background = `var(--depmap-color-${i})`;
    const label = document.createElement("span"); label.className = "depmap-mono"; label.textContent = lane.key;
    chip.append(dot, label); return chip;
  }));

  const consumersOf = {}, importsOf = {};
  DATA.nodes.forEach(node => { consumersOf[node.id] = []; importsOf[node.id] = []; });
  DATA.edges.forEach(([a, b]) => { consumersOf[a].push(b); importsOf[b].push(a); });
  function cone(start, adjacency) {
    const seen = new Set(), pending = [...(adjacency[start] || [])];
    while (pending.length) {
      const next = pending.pop();
      if (!seen.has(next)) { seen.add(next); (adjacency[next] || []).forEach(item => pending.push(item)); }
    }
    return seen;
  }
  function allEdgesMode() {
    return root.querySelector('input[name="depmap-edgemode"]:checked').value === "all";
  }
  function syncLandmarkControl() {
    const visible = allEdgesMode();
    landmarkControl.closest(".depmap-landmark").hidden = !visible;
  }
  function visibleEdges() {
    const showLandmark = allEdgesMode() && landmarkControl.checked;
    let edges = DATA.edges.filter(([a, b]) => !hubs.has(a) && (showLandmark || b !== DATA.landmark));
    if (root.querySelector('input[name="depmap-edgemode"]:checked').value === "skeleton") {
      const adjacency = {}; edges.forEach(([a, b]) => (adjacency[a] = adjacency[a] || []).push(b));
      edges = edges.filter(([a, b]) => {
        const rest = { ...adjacency, [a]: (adjacency[a] || []).filter(item => item !== b) };
        return !cone(a, rest).has(b);
      });
    }
    return edges;
  }
  function camelWords(label) {
    const words = label.match(/[A-Z]+(?=[A-Z][a-z]|[0-9]|$)|[A-Z]?[a-z]+|[0-9]+/g);
    return words && words.join("") === label ? words : [label];
  }
  function labelLines(label, hasOrder) {
    const words = camelWords(label), candidates = [[label]];
    for (let i = 1; i < words.length; i++) candidates.push([words.slice(0, i).join(""), words.slice(i).join("")]);
    const capacity = lines => Math.min(...lines.map((line, i) =>
      (lines.length === 2 && i === 0 && hasOrder ? 92 : 112) / line.length));
    return candidates.reduce((best, lines) => {
      const score = capacity(lines), bestScore = capacity(best);
      return score > bestScore || (score === bestScore && lines.length < best.length) ? lines : best;
    });
  }
  function fitNodeLabel(label, rect, order) {
    for (let pass = 0; pass < 4; pass++) {
      const box = rect.getBBox(), orderBox = order ? order.getBBox() : null;
      let scale = 1;
      for (const line of label.children) {
        const lineBox = line.getBBox(); let right = box.x + box.width - 8;
        const sharesOrderRow = orderBox &&
          Math.min(orderBox.y + orderBox.height, lineBox.y + lineBox.height) > Math.max(orderBox.y, lineBox.y);
        if (sharesOrderRow) right = Math.min(right, orderBox.x - 5);
        if (lineBox.x + lineBox.width > right) scale = Math.min(scale, (right - lineBox.x) / lineBox.width);
      }
      if (scale >= 1) return;
      label.style.fontSize = `${parseFloat(label.style.fontSize) * scale * .995}px`;
    }
  }
  function resetCard() {
    const link = root.querySelector("[data-depmap-name]"); link.textContent = STR.hint; link.removeAttribute("href");
    const meta = root.querySelector("[data-depmap-meta]"); meta.textContent = ""; meta.hidden = true;
    const desc = root.querySelector("[data-depmap-desc]"); desc.textContent = ""; desc.hidden = true;
    const deps = root.querySelector("[data-depmap-deps]"); deps.replaceChildren(); deps.hidden = true;
    root.querySelector("[data-depmap-card]").style.borderLeftColor = "var(--ruler)";
  }
  function showCard(id) {
    const node = byId[id], link = root.querySelector("[data-depmap-name]");
    /* The address travels with the node, from scripts/site/reading_routes.py. A
       preview chapter has no page of its own, so a filename built from the id here
       would point at nothing. */
    link.textContent = id; link.href = node.page + node.anchor;
    root.querySelector("[data-depmap-card]").style.borderLeftColor = laneColor[node.lane];
    const meta = root.querySelector("[data-depmap-meta]");
    meta.textContent = `${node.stage} · ${node.lane} · ${STR.reading} ${String(node.ord).padStart(2, "0")}`;
    meta.hidden = false;
    const desc = root.querySelector("[data-depmap-desc]"); desc.textContent = node.desc; desc.hidden = false;
    const deps = root.querySelector("[data-depmap-deps]"); deps.replaceChildren(); deps.hidden = false;
    for (const [label, items] of [[STR.imports, importsOf[id]], [STR.consumers, consumersOf[id]]]) {
      const group = document.createElement("div"), heading = document.createElement("b");
      heading.textContent = `${label} (${items.length})`; group.append(heading, document.createElement("br"));
      const list = document.createElement("span"); list.textContent = items.map(short).join("、") || STR.none;
      group.append(list); deps.append(group);
    }
  }
  function render(preserveScroll = false) {
    if (!root.getClientRects().length) return;
    const oldLeft = preserveScroll ? scroll.scrollLeft : 0, oldTop = preserveScroll ? scroll.scrollTop : 0;
    const edges = visibleEdges(), layout = DATA.layouts[layoutControl.value];
    const { width, height, positions } = layout, svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
    let shownWidth = width, shownHeight = height;
    if (fitWhole) {
      const scale = Math.min(1, (scroll.clientWidth - 4) / width, (scroll.clientHeight - 4) / height);
      shownWidth *= scale; shownHeight *= scale;
    }
    scroll.classList.toggle("is-fit", fitWhole);
    svg.setAttribute("width", shownWidth); svg.setAttribute("height", shownHeight);
    const canvasWidth = fitWhole ? shownWidth : Math.max(shownWidth, scroll.clientWidth - 4);
    svg.style.minWidth = `${canvasWidth}px`;
    scroll.replaceChildren(svg);
    layout.bands.forEach((band, i) => {
      const rect = document.createElementNS(svgNS, "rect");
      for (const key of ["x", "y", "width", "height"]) rect.setAttribute(key, band[key]);
      rect.setAttribute("fill", i % 2 ? "var(--depmap-lane-alt)" : "var(--depmap-lane)"); svg.append(rect);
      const text = document.createElementNS(svgNS, "text"); text.setAttribute("x", band.x + 14);
      text.setAttribute("y", band.y + 21); text.setAttribute("class", "depmap-lane-label");
      text.textContent = band.label; svg.append(text);
    });
    const defs = document.createElementNS(svgNS, "defs"), marker = document.createElementNS(svgNS, "marker");
    marker.setAttribute("id", "depmap-dependency-arrow"); marker.setAttribute("viewBox", "0 0 6 6");
    marker.setAttribute("refX", "6"); marker.setAttribute("refY", "3"); marker.setAttribute("markerWidth", "5");
    marker.setAttribute("markerHeight", "5"); marker.setAttribute("orient", "auto");
    const arrow = document.createElementNS(svgNS, "path"); arrow.setAttribute("d", "M0 0 L6 3 L0 6 Z");
    arrow.setAttribute("fill", "var(--fg-alt)"); marker.append(arrow); defs.append(marker); svg.append(defs);
    const edgeElements = [];
    edges.forEach(([a, b]) => {
      const p1 = positions[a], p2 = positions[b], x1 = p1.x + NODEW / 2, y1 = p1.y + NODEH;
      const x2 = p2.x + NODEW / 2, y2 = p2.y, dy = Math.max(26, (y2 - y1) * .45);
      const path = document.createElementNS(svgNS, "path");
      path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`);
      path.setAttribute("class", "depmap-edge"); path.setAttribute("marker-end", "url(#depmap-dependency-arrow)");
      path.setAttribute("stroke", laneColor[byId[a].lane]); path.setAttribute("opacity", "var(--depmap-edge-dim)");
      path.dataset.a = a; path.dataset.b = b; svg.append(path); edgeElements.push(path);
    });
    const nodeElements = {};
    DATA.nodes.forEach(node => {
      const group = document.createElementNS(svgNS, "g"); group.setAttribute("class", "depmap-node");
      group.dataset.id = node.id; group.setAttribute("tabindex", "0"); group.setAttribute("role", "button");
      group.setAttribute("aria-pressed", String(pinned === node.id));
      group.setAttribute("aria-label", `${node.id}: ${node.desc}`);
      const title = document.createElementNS(svgNS, "title"); title.textContent = node.id; group.append(title);
      const { x, y } = positions[node.id], rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", x); rect.setAttribute("y", y); rect.setAttribute("width", NODEW); rect.setAttribute("height", NODEH);
      rect.setAttribute("fill", "var(--depmap-panel)"); rect.setAttribute("stroke", laneColor[node.lane]); group.append(rect);
      const label = document.createElementNS(svgNS, "text"), lines = labelLines(short(node.id), Boolean(node.ord));
      label.setAttribute("x", x + 8); label.setAttribute("fill", "var(--text-fg)");
      label.setAttribute("class", "depmap-label"); label.style.fontSize = "13px";
      lines.forEach((line, i) => {
        const span = document.createElementNS(svgNS, "tspan"); span.setAttribute("x", x + 8);
        span.setAttribute("y", lines.length === 1 ? y + 23 : y + 12 + i * 15);
        span.textContent = line; label.append(span);
      });
      group.append(label); svg.append(group);
      let order = null;
      if (node.ord) {
        order = document.createElementNS(svgNS, "text"); order.setAttribute("x", x + NODEW - 7);
        order.setAttribute("y", y + 11); order.setAttribute("text-anchor", "end");
        order.setAttribute("fill", laneColor[node.lane]); order.setAttribute("class", "depmap-order");
        order.textContent = String(node.ord).padStart(2, "0"); group.append(order);
      }
      fitNodeLabel(label, rect, order); nodeElements[node.id] = group;
    });
    function highlight(id) {
      const up = cone(id, importsOf), down = cone(id, consumersOf);
      Object.entries(nodeElements).forEach(([nodeId, element]) =>
        element.classList.toggle("is-faded", nodeId !== id && !up.has(nodeId) && !down.has(nodeId)));
      edgeElements.forEach(element => {
        const { a, b } = element.dataset;
        const active = ((up.has(a) || a === id) && (up.has(b) || b === id)) ||
          ((down.has(b) || b === id) && (down.has(a) || a === id));
        element.setAttribute("opacity", active ? ".9" : ".05");
        element.setAttribute("stroke-width", active ? "2.4" : "1.5");
      });
    }
    function clear() {
      if (pinned) { highlight(pinned); return; }
      Object.values(nodeElements).forEach(element => element.classList.remove("is-faded"));
      edgeElements.forEach(element => {
        element.setAttribute("opacity", "var(--depmap-edge-dim)"); element.setAttribute("stroke-width", "1.5");
      });
      resetCard();
    }
    Object.entries(nodeElements).forEach(([id, element]) => {
      element.addEventListener("mouseenter", () => highlight(id)); element.addEventListener("focus", () => highlight(id));
      element.addEventListener("blur", clear); element.addEventListener("mouseleave", clear);
      element.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault(); element.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
      });
      element.addEventListener("click", event => {
        event.stopPropagation(); pinned = pinned === id ? null : id;
        Object.entries(nodeElements).forEach(([nodeId, item]) => {
          const selected = nodeId === pinned;
          item.classList.toggle("is-pinned", selected); item.setAttribute("aria-pressed", String(selected));
        });
        if (pinned) { showCard(pinned); highlight(pinned); } else clear();
      });
    });
    svg.addEventListener("click", () => {
      pinned = null; Object.values(nodeElements).forEach(element => {
        element.classList.remove("is-pinned"); element.setAttribute("aria-pressed", "false");
      }); clear();
    });
    if (pinned) { nodeElements[pinned].classList.add("is-pinned"); showCard(pinned); highlight(pinned); }
    else resetCard();
    scroll.scrollLeft = preserveScroll ? oldLeft : Math.max(0, (scroll.scrollWidth - scroll.clientWidth) / 2);
    scroll.scrollTop = oldTop;
  }

  root.querySelectorAll('input[name="depmap-edgemode"]').forEach(control =>
    control.addEventListener("change", () => { syncLandmarkControl(); render(true); }));
  layoutControl.addEventListener("change", () => render());
  landmarkControl.addEventListener("change", () => render(true));
  zoomControl.addEventListener("click", () => {
    fitWhole = !fitWhole; zoomControl.textContent = fitWhole ? STR.readable : STR.fit;
    zoomControl.setAttribute("aria-pressed", String(fitWhole)); render();
  });
  syncLandmarkControl();
  if (root.getClientRects().length) render();
  if (document.fonts) document.fonts.ready.then(() => { if (root.getClientRects().length) render(true); });
  document.addEventListener("bedrock:tabchange", event => {
    if (!event.detail || event.detail.id !== "dependency-map") return;
    requestAnimationFrame(() => render(true));
  });
})();
</script>
