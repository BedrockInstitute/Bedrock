# PROBE, not a shipped config. It declares a FLAT vendor that `pi` cannot run.
# The model ID is a self-evident placeholder: no real glm model ID is known to
# this task, and inventing one would write a certainty the evidence does not give.
in_force = "glm"

[vendors.glm]
model = "glm-model-id-not-yet-known"
pi_provider = "glm"
pi_wired = false
default_mode = "in-harness-subagent-mode"
