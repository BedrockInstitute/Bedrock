# dev/build-manifest.toml: the lifecycle regime for `_build/`
#
# THE OWNER'S RULING, 2026-08-13: `_build` must not be a temporary folder and a
# rubbish bin at the same time. EVERY temporary file declares its lifecycle when
# it is created: under what condition it may be deleted, and under what condition
# it moves somewhere permanent.
#
# This file is that declaration, machine-readable.
#
# THE ENFORCER IS GONE, AND THE RULE IS NOT. `scripts/gate/check-build-manifest.py` read
# this file, listed any file in `_build/` that matched no entry, and regenerated
# `_build/README.md` from it. The POD cutover archived it at commit `fc676cb` and deleted
# the `buildmanifest` target from the `Makefile` in the same commit; the checker now sits
# at `archive/scripts/gate/check-build-manifest.py` and `dev/ARCHIVE.md` row 16 records
# why. NOTHING READS THIS FILE TODAY. The rule that produced it still binds every agent:
# `AGENTS.md`, the Boundary clause on `_build/`, orders each new file under `_build/` to
# declare its lifecycle here. So this file is a DECLARATION READ BY REVIEW, and the gap is
# written down rather than left silent. Two things would close it: a replacement checker
# wired into `make check`, or a POD acceptance conjunct that reads these globs.
#
# `_build/README.md` is therefore STALE from `fc676cb` onward, because the generator that
# wrote it is archived. Read this file, never that one.
#
# WHY THIS FILE LIVES IN `dev/` AND NOT IN `_build/`.
# `.gitignore:2` ignores `_build/`, and `scripts/gate/check-probes.py:101-102` fails the
# gate on any TRACKED file under `_build/`. A manifest kept inside `_build/` would
# be untracked, would not survive `make clean` (the `Makefile` `clean:` target), and would not
# survive a fresh clone. A regime that a routine command destroys is not a regime.
# `archive/src/2026-08-13-kits-to-tasks/README.md` records the same finding for refused kits.
# `_build/README.md` WAS GENERATED from this file and is never hand-written. Its generator
# is archived, so that copy is frozen at `fc676cb`; see the header note above.
#
# HOW THE CLASSES WERE CHOSEN.
# They were read off the 73 files `[LJ-1.132]` inventoried, not designed first.
# Two classes exist only because real files had no home in the four-class guess:
# `protected`, for material that can be neither tracked nor deleted, and
# `foreign`, for material that is not the project's to touch. The class that
# produced the whole backlog is `evidence`: it has NO resting place in `_build/`.

# ---------------------------------------------------------------------------
# The classes. Each names its delete condition and its promote condition.
# ---------------------------------------------------------------------------

[classes.toolchain]
what = "Owned by an external tool, which rebuilds it. Never touched by hand."
delete_when = "Never by hand. The owning tool decides."
promote_when = "Never. It is not the project's content."

[classes.protected]
what = """
Cannot be tracked and cannot be deleted. Third-party copyrighted material, or a
record whose regeneration would not reproduce it. It stays in `_build/` because
`_build/` is the only place in the tree that is outside git by construction."""
delete_when = "Never. The `Makefile` `clean:` target exempts it by name."
promote_when = "Never. Promotion would commit it, which is the thing forbidden."

[classes.evidence]
what = """
A measurement that re-running the command would NOT reproduce: a profile of a
tree state that no longer exists, a timing on a machine that has moved.
THIS CLASS HAS NO RESTING PLACE IN `_build/`. It is the class that produced the
[LJ-1.132] backlog: three cold profiles sat one `make clean` from deletion while
`dev/ledger.toml` cited them as the provenance of standing figures."""
delete_when = "Never."
promote_when = """
IMMEDIATELY, as soon as any document cites it. To `dev/measurements/` while a
live document cites it; to `archive/dev/measurements/` once every citing document is
historical (`dev/memos/`, `agents/tasks/`, `agents/tasks/archive/`)."""

[classes.working]
what = """
Alive only while ONE task runs. Named with that task's code, so the owner is
readable from the filename."""
delete_when = "When that task's task-index row stops saying the task is live."
promote_when = "If the report cites it, it is `evidence`. Promote it, do not delete it."
# THE CLOCK WAS WRONG AND [LJ-1.138] CORRECTED IT, 2026-08-13.
# This class said `delete_when = "When that task's report lands"`. It is FALSE in a
# repository that runs C-22, which orders every agent to write its deliverable as a
# skeleton FIRST and fill it as answers land. MEASURED: while [LJ-1.136] was still
# reading, `agents/tasks/LJ-1-136/lj-1.136-report.md` was already 39,948 bytes.
# A MISSING report still proves a task is unfinished, so the signal survives one way
# round: it may WIDEN a hold and it may never close a task.
#
# A PROBE IS THIS CLASS, and `scripts/gate/check-probes.py` is the same rule for `src/`.
# One refinement the `_build/` regime did not need: a task's own closure is not
# enough, because ANOTHER live task may need the file. On 2026-08-13 [LJ-1.134] was
# closed and its probe was still read by [LJ-1.136]. The full trigger is therefore
# "its own task is closed AND no live task needs it", and the tool reads both halves
# off archive/dev/PLAN-archived.md section 11, the live briefs and the missing reports.

[classes.runtime]
what = "State a live tool writes and reads while it runs."
delete_when = "When the owning tool is not running. The tool recreates it."
promote_when = "Never on its own. Quote a load-bearing line into a report instead."

[classes.exhaust]
what = "Reproducible by re-running one named command. Not evidence; output."
delete_when = "At any time, by anyone."
promote_when = "Never. If it cannot be reproduced, it was misclassified: it is evidence."

[classes.foreign]
what = """
Not the project's content. Owner-private data, or a third party's export. An
agent must neither delete it nor move it."""
delete_when = "Only by the owner."
promote_when = "Never. Promotion would commit private data to a public repository."
members = """
NONE today. The class was written for one instance, the owner's billing
export, and the owner deleted it on 2026-08-13 and will not maintain it. The
class stays as a SLOT: it says what to do if such material appears again, and
it claims nothing about what is present."""

# ---------------------------------------------------------------------------
# The entries. `glob` is matched against the path relative to `_build/`.
# ---------------------------------------------------------------------------

[[entries]]
glob = "2.8.0/**"
class = "toolchain"
note = "The Agda interface store, 163 MB. Deleting it costs a twelve minute cold build."

[[entries]]
glob = "literature/**"
class = "protected"
note = """
The fetched OCR text and PDFs of Devlin, Jensen, Jech and Schindler-Zeman.
Copyrighted, so they cannot be committed; `dev/literature/BIBLIOGRAPHY.md:182,191,198`
and `[LJ-1.11]` cite them BY LINE NUMBER, and a re-fetch would not reproduce the
line numbers because they are OCR output. The `Makefile` `clean:` target exempts
this directory by name. Provenance for a re-fetch is
`dev/literature/primary-sources.md:318-336`."""

[[entries]]
glob = "tools/agda-watchdog.log"
class = "runtime"
note = """
The kill log of `scripts/ops/agda-watchdog.sh`, the C-12 backstop. Its two kill
lines are the only field record that the backstop has ever fired; they are
quoted in `agents/tasks/LJ-1-132/lj-1.132-report.md` so the evidence survives a clean."""

[[entries]]
glob = "tools/omlx-watchdog.log"
class = "runtime"
note = """
The decision log of `scripts/ops/omlx-watchdog.sh`, born 2026-08-24. One line per restart
of `oMLX.app`, per reading that refused one, and per post-restart verification. It is the
ONLY record that the restart ever fired, so a report quotes a load-bearing line out of it
rather than promoting the file."""

[[entries]]
glob = "tools/omlx-watchdog.clock"
class = "runtime"
note = """
One epoch, and nothing else: the newest COMPLETED oMLX restart, or the watchdog's own first
start while it has never restarted. It is the origin of the time backstop, which
`qwen_active_hours()` measures from `dev/pod/transitions/`.
DELETING IT IS SAFE IN ONE DIRECTION ONLY, and that is the safe one. A lost clock DELAYS
the next backstop restart and can never advance one, and the 24 GB footprint trigger does
not read it at all, so `make clean` cannot make the watchdog dangerous."""

[[entries]]
glob = "site/**"
class = "exhaust"
note = "Reproduced by `make site`."

[[entries]]
glob = "html/**"
class = "exhaust"
note = "Reproduced by `make site`."

[[entries]]
glob = "woven/**"
class = "exhaust"
note = "Reproduced by `scripts/site/weave-i18n.py --gen --out _build/woven` (the `Makefile` `gen:` target)."

[[entries]]
glob = "types.json"
class = "exhaust"
note = "Reproduced by `scripts/site/extract-types.py --out _build/types.json` (the `Makefile` `types:` target)."

[[entries]]
glob = "tools/*.pid"
class = "runtime"
note = "A running tool's process id. Stale once the tool exits."

# ---------------------------------------------------------------------------
# Temporary paths OUTSIDE `_build/`. Same rule, different directory.
# ---------------------------------------------------------------------------
#
# WHY THIS SECTION EXISTS. The owner's ruling of 2026-08-13 is about a lifecycle,
# not about a directory: every temporary file declares when it may be deleted and
# when it moves somewhere permanent. The POD writes runtime state to `.pod-state/`
# and NOT to `_build/`, because the `Makefile` `clean:` target empties `_build/`
# and would erase a running loop's state (`dev/memos/LJ-4-pod-program-design.md`
# section 4.0). Those files are temporary all the same, so they declare here.
#
# WHAT ENFORCES THIS SECTION, stated plainly so no row claims more than it has.
# NOTHING DOES, AND NOTHING ENFORCES `[[entries]]` EITHER. The scanner that read the
# `[[entries]]` rows above is archived at `fc676cb`, as the header note records; it never
# read these rows, because it scanned `_build/` and nothing else. `.gitignore` keeps
# `.pod-state/` out of the index. The whole file is therefore enforced by REVIEW, and its
# value is that a reader can learn what may be deleted without reading the program.
# A replacement checker with two scanned roots would mechanise both halves at once.
#
# `class` names one of the classes above and carries its meaning. Where the class
# condition is not exact for the path, the row states its own condition and the row
# wins, because a lifecycle that is nearly right deletes real measurements.

[[runtime_outside_build]]
path = ".pod-state/standing.jsonl"
class = "evidence"
writer = "scripts/pod/digest.py, record_standing()"
delete_when = """
Never while the digest is expected to report AD7's second number. Section 8.2 says
the digest RECORDS the standing figure once per day so the number is a LOOKUP and
never a re-derivation, and re-running the digest rebuilds today's row alone. A
deleted file therefore loses every earlier day, and the net-gain fields print
`无更早记录` until two days have passed again."""
promote_when = """
As soon as a document cites a figure from it. Then that figure is `evidence` in the
sense above and its home is `dev/measurements/`. The series itself stays here."""
note = """
One JSON object per local day: `day`, `standing`, `masters`, `recorded`. Append
only, and the reader takes the last row of each day, so a second digest in one day
corrects the first. The caliber is the ledger's, read at HEAD."""

[[runtime_outside_build]]
path = ".pod-state/digest/<YYYY-MM-DD-HHMM>.txt"
class = "evidence"
writer = "scripts/pod/digest.py, write_out()"
delete_when = """
Never by hand while the window it reports is inside any live investigation. Every
FACT behind it is in the tracked transition log, but the three checkout numbers are
not: the standing figure, the orphan master count and the telescope count measure
the tree as it stood at that hour. Re-running the digest against that window
reproduces the counts and NOT those three, so it is not exhaust."""
promote_when = """
As soon as a document cites a figure from it. To `dev/measurements/` while a live
document cites it, and to `archive/dev/measurements/` once every citing document is
historical, exactly as the `evidence` class rules it."""
note = """
One digest, in the shape of section 8.3. About 1.5 KB, and the digest hangs off the
maintainer batch, so the directory grows by two files a day."""

[[runtime_outside_build]]
path = ".pod-state/digest/latest.txt"
class = "exhaust"
writer = "scripts/pod/digest.py, write_out()"
delete_when = """
At any time. The next digest writes it again, and it is a copy of the newest
stamped file beside it."""
promote_when = "Never. Promote the stamped file it copies."
note = """
The newest digest, at a fixed path. `write_digest()` at `scripts/pod/pod.py:1768`
runs the digest under `capture_output=True` and keeps neither stream, so this file
is the only way the text reaches a reader."""
