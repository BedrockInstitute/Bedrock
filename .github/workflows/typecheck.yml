name: typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Install and register cubical 0.9
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://github.com/agda/cubical/archive/refs/tags/v0.9.tar.gz -o cubical.tar.gz
          mkdir -p "${AGDA_DIR}/libraries.d"
          tar xf cubical.tar.gz -C "${AGDA_DIR}/libraries.d/"
          echo "${AGDA_DIR}/libraries.d/cubical-0.9/cubical.agda-lib" >> "${AGDA_DIR}/libraries"
          cat "${AGDA_DIR}/libraries"

      # Interface caches. The key is the hash of every source file, so a push
      # that changes one module re-checks that module and its dependants, not
      # the whole tree; the cubical library's interfaces are keyed on its
      # version alone. A cold run of the whole tree takes about 20 minutes on
      # a laptop; a warm one takes seconds.
      - name: Cache cubical interfaces
        uses: actions/cache@v4
        with:
          path: ${{ env.AGDA_DIR }}/libraries.d/cubical-0.9/_build
          key: cubical-0.9-agda-2.8.0-v1

      - name: Cache tree interfaces
        uses: actions/cache@v4
        with:
          path: _build/2.8.0/agda/src
          key: bedrock-ifaces-${{ hashFiles('src/**/*.lagda.md', 'bedrock.agda-lib') }}
          restore-keys: |
            bedrock-ifaces-

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          make typecheck

      # The gates. Python only, so they cost seconds and run after the
      # typecheck rather than gating it. check-glossary needs tomllib.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint and test
        shell: bash
        run: |
          set -euo pipefail
          make lint PY=python
          make test PY=python
          # `make check` is typecheck + lint + test; the typecheck ran above
          # with its interface cache, so the two halves are split here.
