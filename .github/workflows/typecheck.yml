name: typecheck

on:
  push:
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Cache bedrock-agda
        uses: actions/cache@v4
        with:
          path: |
            _build/bedrock-agda
            _build/bin/bedrock-agda
          key: bedrock-agda-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**') }}

      # Interface caches. The pure proof gate has its own project root, separate
      # from the HTML/type-trace cache used by the deployment workflows. The key
      # is the hash of every source file, while cubical is keyed on its pinned
      # version alone.
      - name: Cache cubical interfaces
        uses: actions/cache@v4
        with:
          path: _build/dependencies/cubical-0.9
          key: cubical-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/environment.json') }}

      - name: Set up Bedrock toolchain
        shell: bash
        run: make toolchain PYTHON=python3

      - name: Cache tree interfaces
        uses: actions/cache@v4
        with:
          path: _build/typecheck/_build/2.8.0/agda/src
          key: bedrock-ifaces-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**', 'src/**/*.lagda.md', 'bedrock.agda-lib') }}
          restore-keys: |
            bedrock-ifaces-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**') }}-

      - name: Typecheck
        shell: bash
        run: |
          set -euo pipefail
          make typecheck

      # The gates. Python only, so they cost seconds and run after the
      # typecheck rather than gating it. check-glossary needs tomllib.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint and test
        shell: bash
        run: |
          set -euo pipefail
          make lint PY=python
          make test PY=python
          # `make check` is typecheck + lint + test; the typecheck ran above
          # with its interface cache, so the two halves are split here.

      - name: Check milestone consumption
        shell: bash
        run: |
          set -euo pipefail
          make milestone-lint PY=python
