name: pages

# Build the multilingual hyperlinked site and deploy it to GitHub Pages.
# Nothing generated is committed; the site is built fresh in CI from the masters.
# Repo setting required once: Settings -> Pages -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Cache bedrock-agda
        uses: actions/cache@v4
        with:
          path: |
            _build/bedrock-agda
            _build/bin/bedrock-agda
          key: bedrock-agda-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**') }}

      - name: Cache cubical interfaces
        uses: actions/cache@v4
        with:
          path: _build/dependencies/cubical-0.9
          key: cubical-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/environment.json') }}

      - name: Set up Bedrock toolchain
        shell: bash
        run: make toolchain PYTHON=python3

      - name: Cache combined site backend
        uses: actions/cache@v4
        with:
          path: |
            _build/2.8.0/agda/src
            _build/html
            _build/bedrock-agda-types.jsonl
          key: bedrock-site-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**', 'src/**/*.lagda.md', 'bedrock.agda-lib') }}
          restore-keys: |
            bedrock-site-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**') }}-

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          make site BASE_URL=/${GITHUB_REPOSITORY#*/} PY=python3

      - name: Link check
        shell: bash
        run: python3 scripts/site/link-check.py _build/site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # turn on GitHub Pages (Actions source) if not already enabled
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
