name: cloudflare

# Build the site (at domain root) and deploy it to Cloudflare Pages -> bedrock.institute.
# This is the canonical deployment; .github/workflows/pages.yml keeps a GitHub Pages mirror.
# Owner setup (once): create a Cloudflare Pages project named "bedrock", point
# bedrock.institute at it, and add the organization secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID to the BedrockInstitute org (inherited by this repo).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Agda 2.8.0
        uses: agda/agda-setup-action@v1
        with:
          agda-version: '2.8.0'

      - name: Cache bedrock-agda
        uses: actions/cache@v4
        with:
          path: |
            _build/bedrock-agda
            _build/bin/bedrock-agda
          key: bedrock-agda-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**') }}

      - name: Cache cubical interfaces
        uses: actions/cache@v4
        with:
          path: _build/dependencies/cubical-0.9
          key: cubical-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/environment.json') }}

      - name: Set up Bedrock toolchain
        shell: bash
        run: make toolchain PYTHON=python3

      - name: Cache combined site backend
        uses: actions/cache@v4
        with:
          path: |
            _build/2.8.0/agda/src
            _build/html
            _build/bedrock-agda-types.jsonl
          key: bedrock-site-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**', 'src/**/*.lagda.md', 'bedrock.agda-lib') }}
          restore-keys: |
            bedrock-site-${{ runner.os }}-${{ hashFiles('tools/bedrock-agda/**') }}-

      - name: Build site (domain root)
        shell: bash
        run: |
          set -euo pipefail
          make site BASE_URL= PY=python3

      - name: Link check
        shell: bash
        run: python3 scripts/site/link-check.py _build/site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _build/site --project-name=bedrock
